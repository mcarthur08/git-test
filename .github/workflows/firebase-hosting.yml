# Publishes the site to Firebase Hosting (https://nt70-quest.web.app) on every push to master.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT_NT70_QUEST (see SETUP.md).
name: Deploy to Firebase Hosting
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NT70_QUEST }}
          channelId: live
          projectId: nt70-quest
