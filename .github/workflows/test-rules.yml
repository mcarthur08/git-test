# Publishes firestore.rules to the TEST project whenever they change on any branch, so new
# features work on the test site and previews right away. Live rules are still published by hand
# from the Firebase console (SETUP.md step 5).
name: Test database rules
on:
  push:
    paths: [firestore.rules, firebase.staging.json, .github/workflows/test-rules.yml]
  workflow_dispatch:
concurrency:
  group: test-rules
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NT_QUEST }}
    steps:
      - if: env.KEY == ''
        run: echo "::notice::No FIREBASE_SERVICE_ACCOUNT_NT_QUEST secret yet. See SETUP.md, Test environment."
      - if: env.KEY != ''
        uses: actions/checkout@v4
      - if: env.KEY != ''
        name: Publish rules to nt-quest
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json"
          npx --yes firebase-tools deploy --only firestore:rules --config firebase.staging.json --project nt-quest --non-interactive
