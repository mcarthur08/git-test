# Publishes the test site (https://nt-quest.web.app) on every push to the staging branch.
# It uses the separate test Firebase project, with its own users and database.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT_NT_QUEST (see SETUP.md, "Test environment").
name: Deploy test site
on:
  push:
    branches: [staging]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:staging
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NT_QUEST }}
          channelId: live
          projectId: nt-quest
