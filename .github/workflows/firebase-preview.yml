# Publishes a temporary preview of every pull request to a Firebase Hosting preview channel and
# comments the URL on the PR. Previews expire after 7 days. They use the separate test Firebase
# project (nt-quest), so test users and data never touch the real app. Needs the repository secret
# FIREBASE_SERVICE_ACCOUNT_NT_QUEST (see SETUP.md, "Test environment").
name: Firebase preview
on:
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: Preview channel name
        default: test
jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:staging
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NT_QUEST }}
          projectId: nt-quest
          channelId: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || '' }}
          expires: 7d
