<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#F0562A" />
    <title>NT70 Quest · Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0e0b09;
        color: #ece1ca;
        font-family: Georgia, serif;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 8px;
      }
      p {
        color: #a8977c;
        margin: 0 0 20px;
      }
      button {
        font: inherit;
        padding: 12px 22px;
        border-radius: 6px;
        border: 1px solid #6e4f1e;
        background: #d9ae55;
        color: #22170a;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>NT70 Quest needs a connection the first time. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
