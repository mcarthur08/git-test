<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>NT70 Reading Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — top bar + pill tabs on desktop, bottom tab bar on phones; soft rounded cards on a cool ground; sunrise flame + Galilee teal accents. */
:root {
  --bg: #F2F4FA;
  --surface: #FFFFFF;
  --surface-2: #EBEFF7;
  --ink: #141B2D;
  --muted: #5A6377;
  --line: #DCE1EC;
  --flame: #F0562A;
  --flame-2: #FF9A3C;
  --gold: #F5B301;
  --teal: #0E9C8D;
  --violet: #7C4DFF;
  --rose: #E11D48;
  --sky: #2F7BF0;
  --on: #FFFFFF;
  --gold-ink: #3A2A00;
  --sec-g: #0E9C8D; --sec-a: #F0562A; --sec-p: #D98A00; --sec-l: #7C4DFF; --sec-r: #E11D48;
  --shadow: 0 1px 2px rgba(20,27,45,.06), 0 10px 30px -8px rgba(20,27,45,.16);
  --shadow-lg: 0 20px 60px -12px rgba(20,27,45,.35);
  --radius: 22px;
  --sea: #CBE7F4; --sea-ink: #3D8DC2; --land: #F4E6C4; --land-2: #E9D3A1; --hill: #D7BB82; --hill-2: #C4A56A; --tree: #7EB46A; --map-ink: #6A5532;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --step--1: 0.8125rem; --step-0: 1rem; --step-1: 1.25rem; --step-2: 1.6rem; --step-3: 2.4rem;
  --ease: cubic-bezier(.2,.8,.2,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1020; --surface: #151C2E; --surface-2: #1E273C; --ink: #EEF2FA; --muted: #9BA5BA; --line: #2A3450;
    --flame: #FF6A3D; --flame-2: #FFA552; --gold: #FFC531; --teal: #2CC4B2; --violet: #9B7BFF; --rose: #FF4D73; --sky: #5B9BFF;
    --on: #FFFFFF; --gold-ink: #2A1E00;
    --sec-g: #1FAE9E; --sec-a: #FF6A3D; --sec-p: #E39A10; --sec-l: #8A62FF; --sec-r: #F0365E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -8px rgba(0,0,0,.55);
    --shadow-lg: 0 20px 60px -12px rgba(0,0,0,.7);
    --sea: #13324A; --sea-ink: #5FA9DA; --land: #3A3428; --land-2: #4A4130; --hill: #5E513A; --hill-2: #4E432F; --tree: #4E8A4F; --map-ink: #E6D8BA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1020; --surface: #151C2E; --surface-2: #1E273C; --ink: #EEF2FA; --muted: #9BA5BA; --line: #2A3450;
  --flame: #FF6A3D; --flame-2: #FFA552; --gold: #FFC531; --teal: #2CC4B2; --violet: #9B7BFF; --rose: #FF4D73; --sky: #5B9BFF;
  --on: #FFFFFF; --gold-ink: #2A1E00;
  --sec-g: #1FAE9E; --sec-a: #FF6A3D; --sec-p: #E39A10; --sec-l: #8A62FF; --sec-r: #F0365E;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -8px rgba(0,0,0,.55);
  --shadow-lg: 0 20px 60px -12px rgba(0,0,0,.7);
  --sea: #13324A; --sea-ink: #5FA9DA; --land: #3A3428; --land-2: #4A4130; --hill: #5E513A; --hill-2: #4E432F; --tree: #4E8A4F; --map-ink: #E6D8BA;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: var(--step-0); line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, .disp { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; margin: 0; line-height: 1.1; }
h2 { font-size: var(--step-2); }
h3 { font-size: var(--step-1); font-weight: 700; }
p { margin: 0; }
a { color: var(--sky); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand-mark { width: 38px; height: 38px; flex: none; border-radius: 12px; background: linear-gradient(135deg, var(--flame), var(--flame-2) 60%, var(--gold)); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: -0.03em; box-shadow: 0 6px 16px -6px var(--flame); }
.brand h1 { font-size: var(--step-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { display: block; font-family: var(--font-body); font-weight: 500; font-size: var(--step--1); color: var(--muted); letter-spacing: 0; }
.mepill { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 0; border-radius: 999px; padding: 3px 12px 3px 3px; cursor: pointer; min-width: 0; }
.mepill .bubble { width: 34px; height: 34px; }
.mepill span:not(.bubble) { font-weight: 700; font-size: var(--step--1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
.tabs { display: flex; gap: 4px; padding-block: 0 10px; }
.tabs button { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; color: var(--muted); cursor: pointer; transition: background .2s, color .2s; }
.tabs button svg { width: 18px; height: 18px; }
.tabs button:hover { background: var(--surface-2); color: var(--ink); }
.tabs button[aria-current="page"] { background: var(--ink); color: var(--surface); }

main { padding-block: 22px 72px; display: grid; gap: 18px; }
main.enter > * { animation: rise .5s var(--ease) both; }
main.enter > *:nth-child(2) { animation-delay: .05s; } main.enter > *:nth-child(3) { animation-delay: .1s; }
main.enter > *:nth-child(4) { animation-delay: .15s; } main.enter > *:nth-child(5) { animation-delay: .2s; } main.enter > *:nth-child(n+6) { animation-delay: .25s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* Cards */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }
.eyebrow { font-size: var(--step--1); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.note { border-radius: 16px; padding: 12px 16px; background: color-mix(in srgb, var(--sky) 12%, var(--surface)); color: var(--ink); }
.note.warn { background: color-mix(in srgb, var(--rose) 14%, var(--surface)); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; background: var(--surface-2); padding: 11px 18px; font-weight: 700; cursor: pointer; text-decoration: none; color: var(--ink); transition: transform .15s var(--spring), box-shadow .2s, filter .2s; }
.btn:hover { filter: brightness(1.04); }
.btn:active { transform: scale(.96); }
.btn svg { width: 18px; height: 18px; }
.btn.go { background: linear-gradient(135deg, var(--flame), var(--flame-2)); color: #fff; box-shadow: 0 10px 24px -10px var(--flame); }
.btn.dark { background: var(--ink); color: var(--surface); }
.btn.big { font-size: var(--step-1); padding: 15px 26px; font-family: var(--font-display); font-weight: 800; }
.btn.sm { padding: 7px 12px; font-size: var(--step--1); }
.btn.danger { background: var(--rose); color: #fff; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn.done-state { background: color-mix(in srgb, var(--teal) 16%, var(--surface)); color: var(--teal); box-shadow: none; }

.chip svg { width: 14px; height: 14px; flex: none; }
.chip { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: var(--step--1); font-weight: 700; background: var(--surface-2); }
.chip.sec { background: color-mix(in srgb, var(--sc) 16%, var(--surface)); color: var(--sc); }
.chip.ok { background: color-mix(in srgb, var(--teal) 16%, var(--surface)); color: var(--teal); }
.chip.behind { background: color-mix(in srgb, var(--rose) 14%, var(--surface)); color: var(--rose); }
.sec-g { --sc: var(--sec-g); } .sec-a { --sc: var(--sec-a); } .sec-p { --sc: var(--sec-p); } .sec-l { --sc: var(--sec-l); } .sec-r { --sc: var(--sec-r); }

/* Avatar */
.av { display: block; overflow: visible; }
.av .a-body { transform-origin: 60px 150px; }
.av .a-head { transform-origin: 60px 80px; }
.av .eyes { transform-origin: 60px 54px; }
.av .arm-l { transform-origin: 40px 88px; transition: transform .45s var(--spring); }
.av .arm-r { transform-origin: 80px 88px; transition: transform .45s var(--spring); }
.av.live .a-body { animation: breathe 3.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
.av.live .a-head { animation: sway 6s ease-in-out infinite; animation-delay: var(--d, 0s); }
.av.live .eyes { animation: blink 5s infinite; animation-delay: var(--d, 0s); }
.av .flame { transform-origin: 90px 120px; animation: flicker .5s ease-in-out infinite alternate; }
@keyframes breathe { 50% { transform: translateY(-1.5px) scaleY(1.012); } }
@keyframes sway { 25% { transform: rotate(-2.5deg); } 75% { transform: rotate(2.5deg); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.08); } }
@keyframes flicker { to { transform: scale(1.12, .9); } }
.av.cheer .a-body { animation: jump 1s var(--ease) 2; }
.av.cheer .arm-l { transform: rotate(150deg); }
.av.cheer .arm-r { transform: rotate(-150deg); }
@keyframes jump { 0%, 100% { transform: none; } 30% { transform: translateY(-16px) scaleY(1.03); } 55% { transform: translateY(0) scaleY(.95); } 70% { transform: translateY(-4px); } }
.bubble { border-radius: 50%; background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--flame-2) 30%, var(--surface)), var(--surface-2)); overflow: hidden; flex: none; display: grid; place-items: end center; }
.bubble .av { width: 100%; height: 100%; }

/* Today */
.hero { display: grid; grid-template-columns: 190px 1fr; gap: 24px; align-items: center; }
.stage { position: relative; display: grid; place-items: end center; height: 230px; border-radius: 20px; background:
  radial-gradient(120% 80% at 50% 100%, color-mix(in srgb, var(--flame-2) 32%, transparent), transparent 70%),
  linear-gradient(180deg, color-mix(in srgb, var(--sky) 10%, var(--surface)), var(--surface-2)); overflow: hidden; }
.stage::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: 14px; height: 10px; border-radius: 50%; background: rgba(0,0,0,.12); filter: blur(3px); }
.stage .av { width: 150px; height: 200px; position: relative; z-index: 1; margin-bottom: 4px; }
.hero-day { font-size: var(--step-3); }
.hero-read { font-size: var(--step-2); font-family: var(--font-display); font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: var(--step-2); font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat b small { font-size: var(--step-0); color: var(--muted); font-weight: 600; }
.stat .sl { font-size: var(--step--1); color: var(--muted); }
.stat .ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; margin-bottom: 6px; }
.stat .ic svg { width: 16px; height: 16px; }
.meter { height: 12px; border-radius: 999px; background: var(--surface-2); position: relative; overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: linear-gradient(90deg, var(--flame), var(--flame-2), var(--gold)); transition: width 1s var(--ease); }
.meter i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); transform: translateX(-100%); animation: shine 2.6s ease-in-out infinite 1s; }
@keyframes shine { 60%, 100% { transform: translateX(100%); } }
.catch { display: flex; flex-wrap: wrap; gap: 8px; }

/* Badges */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.badge { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 16px; background: var(--surface-2); }
.badge.locked { opacity: .5; }
.badge.locked .medal-ic { filter: grayscale(1); }
.medal-ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), 0 4px 10px -4px var(--bc); background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--bc) 60%, #fff), var(--bc) 70%); }
.medal-ic svg { width: 20px; height: 20px; }
.badge b { display: block; font-size: var(--step--1); line-height: 1.2; }
.badge span { font-size: 0.72rem; color: var(--muted); line-height: 1.2; display: block; }

/* Plan grid */
.week { display: grid; gap: 8px; }
.week + .week { margin-top: 16px; }
.week-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; align-items: baseline; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.tile { position: relative; border: 0; border-radius: 14px; background: var(--surface-2); min-height: 70px; padding: 8px; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; transition: transform .2s var(--spring), background .25s, box-shadow .2s; box-shadow: inset 0 3px 0 var(--sc); }
.tile:hover { transform: translateY(-2px); }
.tile .n { font-family: var(--font-display); font-weight: 800; font-size: var(--step-1); line-height: 1; }
.tile .r { font-size: 0.7rem; line-height: 1.15; overflow-wrap: anywhere; color: var(--muted); }
.tile .ck { position: absolute; right: 7px; top: 8px; width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,.25); display: grid; place-items: center; }
.tile .ck svg { width: 12px; height: 12px; }
.tile.done { background: var(--sc); color: #fff; box-shadow: 0 8px 18px -10px var(--sc); }
.tile.done .r { color: rgba(255,255,255,.85); }
.tile.today { box-shadow: inset 0 3px 0 var(--sc), 0 0 0 3px var(--gold); }
.tile.sel { box-shadow: 0 0 0 3px var(--ink); }
.tile.vic::before { content: ""; position: absolute; left: 8px; bottom: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 30%, transparent); }
.tile.done.vic::before { background: #fff; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }

/* Group */
.teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.team { border-radius: 18px; padding: 14px; background: var(--surface-2); display: grid; gap: 8px; }
.team h3 { display: flex; align-items: center; gap: 8px; font-size: var(--step-0); }
.team .meter i { background: var(--tc); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
.rank1 { font-size: 0.7rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--gold); color: var(--gold-ink); }
.track-wrap { overflow-x: auto; border-radius: 18px; background: linear-gradient(180deg, color-mix(in srgb, var(--sky) 8%, var(--surface)), var(--surface-2)); scrollbar-width: thin; }
.track { display: grid; grid-template-columns: repeat(71, 34px); align-items: end; width: max-content; padding: 10px 14px 12px; position: relative; }
.track::after { content: ""; position: absolute; left: 31px; right: 31px; bottom: 21px; height: 4px; border-radius: 4px; background: var(--line); z-index: 0; }
.tcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; position: relative; z-index: 1; }
.tcol .ppl { display: flex; flex-direction: column-reverse; align-items: center; min-height: 52px; }
.tcol .ppl > span + span { margin-bottom: -18px; }
.tcol .av { width: 30px; height: 40px; }
.tcol .more { font-size: 0.65rem; font-weight: 800; }
.tdot { width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); }
.tdot.mile { width: 18px; height: 18px; background: var(--gold); border-color: var(--surface); box-shadow: 0 0 0 2px var(--gold); }
.tdot.go { width: 18px; height: 18px; background: var(--teal); border-color: var(--surface); }
.tdot.me { background: var(--flame); border-color: var(--surface); box-shadow: 0 0 0 3px color-mix(in srgb, var(--flame) 40%, transparent); }
.tlabel { font-size: 0.62rem; font-weight: 700; color: var(--muted); height: 12px; line-height: 12px; }
.board { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 26px 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; border-radius: 16px; padding: 8px 12px; background: var(--surface-2); }
.prow.me { background: color-mix(in srgb, var(--flame) 12%, var(--surface)); }
.prow .rank { font-family: var(--font-display); font-weight: 800; font-size: var(--step-1); text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
.prow:nth-child(-n+3) .rank { color: var(--gold); }
.prow .bubble { width: 44px; height: 44px; }
.prow .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .who span { font-size: var(--step--1); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.prow .nums { text-align: right; font-variant-numeric: tabular-nums; font-size: var(--step--1); color: var(--muted); display: grid; justify-items: end; gap: 4px; }
.prow .nums b { font-family: var(--font-display); font-size: var(--step-1); color: var(--ink); line-height: 1; }

/* Victories */
.vics { display: grid; gap: 16px; }
.vic { display: grid; grid-template-columns: 72px 1fr; gap: 18px; }
.vic .medal { width: 72px; height: 72px; }
.vic.locked { background: var(--surface-2); box-shadow: none; }
.vic.locked .medal { filter: grayscale(1); opacity: .45; }
.vic blockquote { margin: 4px 0; padding: 12px 16px; border-radius: 14px; background: color-mix(in srgb, var(--gold) 14%, var(--surface)); font-family: var(--font-display); font-weight: 600; font-size: var(--step-1); line-height: 1.3; letter-spacing: -0.01em; }
.vic blockquote span { display: block; font-family: var(--font-body); font-size: var(--step--1); font-weight: 600; color: var(--muted); margin-top: 4px; letter-spacing: 0; }
.vic .q { padding: 12px 14px; border-radius: 14px; background: var(--surface-2); }
.vic .body { display: grid; gap: 10px; max-width: 68ch; }

/* Editor */
.editor { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 26px; }
.preview { display: grid; justify-items: center; gap: 10px; align-content: start; position: sticky; top: 130px; }
.preview .stage { width: 100%; height: 260px; }
.preview .stage .av { width: 170px; height: 227px; }
.preview .alias { font-family: var(--font-display); font-weight: 800; font-size: var(--step-1); text-align: center; }
.field { display: grid; gap: 8px; }
.field > label, .field > .lbl { font-weight: 700; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border: 0; border-radius: 999px; background: var(--surface-2); padding: 7px 12px; cursor: pointer; font-size: var(--step--1); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; transition: background .2s, color .2s, transform .15s var(--spring); }
.opt:active { transform: scale(.94); }
.opt[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.opt[disabled] { cursor: not-allowed; opacity: .4; text-decoration: line-through; }
.opt.lock { opacity: .55; }
.opt .lk { width: 12px; height: 12px; }

function normPlayer(d, id) {
  if (!d || typeof d !== "object") return null;
  const done = {};
  if (d.done && typeof d.done === "object") for (const [k, v] of Object.entries(d.done)) {
    const n = +k; if (Number.isInteger(n) && n >= 1 && n <= DAYS && typeof v === "string" && parseISO(v)) done[n] = v;
  }
  return { id, alias: typeof d.alias === "string" && d.alias.trim() ? d.alias.slice(0, 40) : "Traveler",
    gender: d.gender === "f" ? "f" : "m", team: typeof d.team === "string" ? d.team.slice(0, 30) : "",
    look: d.look && typeof d.look === "object" ? d.look : {}, done,
    createdAt: typeof d.createdAt === "string" ? d.createdAt : "", updatedAt: typeof d.updatedAt === "string" ? d.updatedAt : "" };
}
function stats(p) {
  const days = Object.keys(p.done).map(Number), doneSet = new Set(days);
  const chapters = days.reduce((s, d) => s + PLAN[d - 1].count, 0);
  const dates = new Set(Object.values(p.done));
  let cur = 0; const d = new Date(); if (!dates.has(iso(d))) d.setDate(d.getDate() - 1);
  while (dates.has(iso(d))) { cur++; d.setDate(d.getDate() - 1); }
  let best = 0, run = 0, prev = null;
  [...dates].map(parseISO).sort((a, b) => a - b).forEach(x => { run = prev && daysBetween(prev, x) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = x; });
  return { n: days.length, doneSet, chapters, streak: cur, best };
}

/* ---------- saving ---------- */
let saveTimer = null, writing = false, dirty = false;
function saveMe() {
  if (state.mode === "local") { lsSet("nt70.me", state.me); return; }
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 350);
}
async function flush() {
  saveTimer = null;
  if (writing) { dirty = true; return; }
  writing = true; dirty = false;
  const me = state.me;
  try {
    await state.db.doc("players/" + state.uid).set({ alias: me.alias, gender: me.gender, team: me.team, look: me.look, done: me.done,
      createdAt: me.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString() });
    state.writeError = null;
  } catch (e) {
    if (e && e.code === "invalid_argument") state.readOnly = true;
    state.writeError = (e && e.code) || "unavailable";
    render(true);
  }
  writing = false;
  if (dirty) flush();
}
const savePending = () => writing || dirty || saveTimer !== null;

    text: "In Jericho, blind Bartimaeus received his sight, and a short tax collector named Zacchaeus climbed a sycomore tree and met Jesus.",

const qpt = (a, c, b, t) => ({ x: (1 - t) ** 2 * a.x + 2 * (1 - t) * t * c.x + t * t * b.x, y: (1 - t) ** 2 * a.y + 2 * (1 - t) * t * c.y + t * t * b.y });
function segCtrl(k) {
  const a = STOPS[k], b = STOPS[k + 1], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
  const off = (k % 2 ? 1 : -1) * Math.min(28, len * 0.16);
  return { x: mx - dy / len * off, y: my + dx / len * off };
}
function journeyPos(n) {
  n = Math.max(0, Math.min(DAYS, n));
  for (let k = 0; k < STOPS.length - 1; k++) {
    if (n < STOPS[k + 1].day) { const t = (n - STOPS[k].day) / (STOPS[k + 1].day - STOPS[k].day); return { k, t, ...qpt(STOPS[k], segCtrl(k), STOPS[k + 1], t) }; }
  }
  const last = STOPS[STOPS.length - 1]; return { k: STOPS.length - 1, t: 0, x: last.x, y: last.y };
}
function routePath(n) {
  const p = journeyPos(n); let d = `M${STOPS[0].x} ${STOPS[0].y}`;
  for (let k = 0; k < p.k && k < STOPS.length - 1; k++) { const c = segCtrl(k); d += ` Q${c.x.toFixed(1)} ${c.y.toFixed(1)} ${STOPS[k + 1].x} ${STOPS[k + 1].y}`; }
  if (p.k < STOPS.length - 1 && p.t > 0) { const a = STOPS[p.k], c = segCtrl(p.k), c1 = { x: a.x + (c.x - a.x) * p.t, y: a.y + (c.y - a.y) * p.t }; d += ` Q${c1.x.toFixed(1)} ${c1.y.toFixed(1)} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`; }
  return d;
}
const fullRoute = () => routePath(DAYS);
const placeAvatar = (svg, x, y, w) => svg.replace("<svg ", `<svg x="${(x - w / 2).toFixed(1)}" y="${(y - w * 4 / 3 + 3).toFixed(1)}" width="${w}" height="${(w * 4 / 3).toFixed(1)}" `);

  const waves = [[60, 120], [40, 200], [80, 330], [30, 420], [50, 500], [110, 60]].map(([x, y]) => `<path d="M${x} ${y} q5 -4 10 0 t10 0" fill="none" stroke="var(--sea-ink)" stroke-width="1.4" opacity=".45"/>`).join("");
  const stops = STOPS.map((s, i) => {

    const label = s.la === "none" ? "" : `<text x="${s.x + s.lx}" y="${s.y + s.ly}" text-anchor="${s.la}" class="m-town${last ? " big" : ""}">${esc(s.place)}</text>`;
    const attrs = opts.mini ? "" : ` data-stop="${i}" tabindex="0" role="button" aria-label="${esc(s.place)}: ${esc(s.title)}${reached ? ", reached" : `, at day ${s.day}`}"`;
    return `<g class="m-stop${reached ? " reached" : ""}${next ? " next" : ""}${sel === i && !opts.mini ? " sel" : ""}"${attrs}>

  let crowd = "";
  buckets.forEach((ps, n) => {

  let meSVG = "";

  return `<svg class="map" viewBox="${vb}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of the land of Israel showing Jesus' journey from Bethlehem to Jerusalem for the Passover">

    <path d="M276 152 C292 152 291 175 287 188 C283 198 270 200 267 190 C262 176 264 156 276 152 Z" fill="var(--sea)" stroke="var(--sea-ink)" stroke-width="1.5"/>
    <path d="M270 430 C286 430 288 470 285 505 C283 530 270 540 264 525 C258 500 258 445 270 430 Z" fill="var(--sea)" stroke="var(--sea-ink)" stroke-width="1.5"/>

function viewJourney() {
  const n = stats(state.me).n, pos = journeyPos(n);
  const nextI = STOPS.findIndex(s => s.day > n), next = STOPS[nextI];
  const sel = state.stop ?? (next ? Math.max(0, nextI - 1) : STOPS.length - 1);
  const s = STOPS[sel], open = n >= s.day || (state.canLead && state.mode === "shared");
  const card = `<div class="stop-card" id="stopcard"><div class="row between"><p class="eyebrow">Stop ${sel + 1} of ${STOPS.length} · ${n >= s.day ? "reached" : `day ${s.day}`}</p><span class="chip">${esc(s.ref)}</span></div>
    <h3>${esc(s.place)}: ${esc(s.title)}</h3>
    ${open ? `<p>${esc(s.text)}</p><blockquote>"${esc(s.verse)}"<span>${esc(s.verseRef)} · KJV</span></blockquote>
      <div class="row"><a class="btn sm" href="${readingURL(s.ref.split(";")[0], "KJV")}" target="_blank" rel="noopener">Read ${esc(s.ref.split(";")[0])} ${icon("ext")}</a></div>`
      : `<p class="muted">Read ${plural(s.day - n, "more day")} to walk here and unlock this stop.</p>`}
    <div class="row" style="justify-content:space-between"><button class="btn sm" data-stopnav="-1" ${sel === 0 ? "disabled" : ""}>Previous stop</button><button class="btn sm" data-stopnav="1" ${sel === STOPS.length - 1 ? "disabled" : ""}>Next stop</button></div></div>`;

    <p class="muted small" style="max-width:68ch">Every day you read moves your character along the road Jesus walked. Finish all 70 days and you arrive in Jerusalem for the Passover. Tap a town to read what happened there.</p>

  <section class="card stack"><h3>All stops</h3><ol class="stoplist">${STOPS.map((t, i) => `<li class="${n >= t.day ? "reached" : ""}${i === sel ? " cur" : ""}"><button data-stop="${i}"><span class="sn">${n >= t.day ? icon("check") : i + 1}</span><span><b>${esc(t.place)}</b><span class="small muted">${esc(t.title)} · day ${t.day}</span></span></button></li>`).join("")}</ol></section>`;
}

/* ---------- views ---------- */
const dayDate = (start, day) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + day - 1);

function headerHTML() {
  const tabs = TABS.filter(([k]) => k !== "leader" || state.canLead);
  const me = state.me;
  return `<div class="wrap bar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">70</span><h1>NT70 Quest<small>${esc(state.config.groupName)} · New Testament in 70 days</small></h1></div>

    </div>

}

function viewToday() {
  const me = state.me, s = stats(me), pd = planDay(), start = parseISO(state.config.start);
  const target = pd !== null && pd >= 1 && pd <= DAYS ? pd : null;
  const focus = target && !s.doneSet.has(target) ? target : nextUndone(s);
  const behind = target ? PLAN.slice(0, target - 1).filter(d => !s.doneSet.has(d.day)) : [];
  const cheer = Date.now() < state.cheerUntil;
  let banner = "";
  if (!start) banner = state.canLead
    ? `<div class="note">Set the group's start date under <a href="#leader" data-tab="leader">Leader</a> so everyone shares one calendar. Until then, start with Day 1.</div>`
    : `<div class="note">Your leader hasn't set the start date yet. You can begin with Day 1 now.</div>`;
  else if (pd < 1) banner = `<div class="note">The quest starts ${fmtDate(start)}, in ${plural(1 - pd, "day")}. Reading ahead is allowed.</div>`;
  else if (pd > DAYS) banner = `<div class="note">The 70 days ended ${fmtDate(dayDate(start, DAYS))}. Finish any days you missed.</div>`;
  const pace = target ? (s.n >= target ? `<span class="chip ok">${icon("check")} On pace</span>` : `<span class="chip behind">${plural(target - s.n, "day")} behind</span>`) : "";

  let hero;
  const stage = `<div class="stage">${avatarSVG(me.look, s.n, { live: true, cheer })}</div>`;
  if (focus === null) {
    hero = `<div class="hero">${stage}<div class="stack">

  } else {
    const p = PLAN[focus - 1];
    const lead = target && focus !== target ? (focus > target ? "Today's reading is done · read ahead" : "Next up") : (target ? "Today's reading" : "Up next");
    const dateLine = start ? ` · ${fmtDate(dayDate(start, focus))}` : "";
    hero = `<div class="hero">${stage}<div class="stack" style="gap:14px">
      <div class="stack" style="gap:6px"><p class="eyebrow">${lead}${dateLine}</p><h2 class="hero-day">Day ${focus}</h2><p class="hero-read">${esc(p.label)}</p></div>
      <div class="row"><span class="chip sec sec-${p.sec}">${SECTIONS[p.sec]}</span><span class="chip">${icon("book")} ${plural(p.count, "chapter")}</span>${pace}</div>
      <div class="row">
        <button class="btn go big" data-toggle="${focus}" ${state.readOnly ? "disabled" : ""}>${icon("check")} I read Day ${focus}</button>
        <a class="btn" href="${readingURL(p.label, state.config.version)}" target="_blank" rel="noopener">Open Bible (${esc(state.config.version)}) ${icon("ext")}</a>
      </div></div></div>`;
  }

  return `${banner}
  ${state.readOnly ? `<div class="note warn">You can look around, but your progress can't be saved yet. Ask your leader to give you <b>Contributor</b> access to this page.</div>` : ""}

    ${stat("ch", s.chapters, "", "of 260 chapters", "var(--sky)", "book")}
    ${stat("streak", s.streak, "", `day streak · best ${s.best}`, "var(--flame)", "flame")}
    ${stat("pct", pct, "%", "of the New Testament", "var(--violet)", "target")}
  </section>
  <div class="meter" role="img" aria-label="${s.chapters} of 260 chapters"><i data-w="${s.chapters / TOTAL * 100}" data-k="m-main" style="width:${s.chapters / TOTAL * 100}%"></i></div>
  ${behind.length ? `<section class="card stack"><h3>Catch up</h3><p class="small muted">Tap a day to mark it read. Each one gets you closer to the group.</p>
    <div class="catch">${behind.map(d => `<button class="btn sm" data-toggle="${d.day}" ${state.readOnly ? "disabled" : ""}>Day ${d.day} · ${esc(d.short)}</button>`).join("")}</div></section>` : ""}
  ${tripCard(s.n)}

      <div class="row" style="gap:14px;flex-wrap:nowrap;min-width:0">${victoryMedal(VICTORIES.indexOf(nv)).replace('class="medal"', 'class="medal" style="width:52px;height:52px;flex:none;filter:grayscale(.6);opacity:.8"')}
      <div style="min-width:0"><p class="eyebrow">Next Victory Moment · Day ${nv.day}</p><h3>${esc(nv.title)}</h3><p class="small muted">${plural(nv.day - s.n, "more day")} to unlock this story from ${esc(nv.ref)}.</p></div></div>
      <button class="btn sm" data-tab="victories">See victories</button></section>` : ""}
  <section class="card stack"><div class="row between"><h3>Badges</h3><span class="small muted">${BADGES.filter(b => b.test(s)).length} of ${BADGES.length}</span></div>

}

  const pos = journeyPos(n), next = STOPS.find(t => t.day > n);

  return `<section class="card trip"><button class="trip-map" data-tab="journey" aria-label="Open the journey map">${mapSVG({ mini: true })}</button>
    <div class="stack" style="gap:6px"><p class="eyebrow">Journey to the Passover</p><h3>${esc(where)}</h3>
    <p class="small muted">${next ? `${plural(next.day - n, "day")} to ${esc(next.place)} · ${plural(DAYS - n, "day")} to the Passover in Jerusalem` : "You walked the whole road with Jesus, from Bethlehem to Jerusalem."}</p>
    <div><button class="btn sm" data-tab="journey">${icon("journey")} Open map</button></div></div></section>`;

function viewPlan() {

      const p = PLAN[w * 7 + i - 1], done = s.doneSet.has(p.day);
      weeks += `<button class="tile sec-${p.sec} ${done ? "done" : ""} ${pd === p.day ? "today" : ""} ${state.sel === p.day ? "sel" : ""} ${p.day % 7 === 0 ? "vic" : ""}"
        data-sel="${p.day}" aria-label="Day ${p.day}: ${esc(p.label)}${done ? ", read" : ""}">${done ? `<span class="ck">${icon("check")}</span>` : ""}<span class="n">${p.day}</span><span class="r">${esc(p.short)}</span></button>`;
    }
    weeks += `</div></div>`;
  }
  return `${detail}<section class="card stack">
    <div class="row between"><h2>The 70-day map</h2><span class="small muted">${s.n}/70 days · about 4 chapters a day</span></div>

/* ---------- render ---------- */
const prevVals = {};
function animateValues() {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll("[data-count]").forEach(el => {
    const k = el.dataset.k, to = +el.dataset.count, from = prevVals[k] ?? 0; prevVals[k] = to;
    if (reduce || from === to) return;
    const t0 = performance.now(), dur = 800;
    const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  document.querySelectorAll(".meter i[data-w]").forEach(el => {
    const k = el.dataset.k, to = +el.dataset.w, from = prevVals[k] ?? 0; prevVals[k] = to;
    if (reduce || from === to) return;
    el.style.transition = "none"; el.style.width = from + "%"; void el.offsetWidth;
    el.style.transition = ""; el.style.width = to + "%";
  });
}
function render(force) {
  const main = $("#main"), ae = document.activeElement;
  if (!force && ae && main.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) { state.renderPending = true; return; }
  state.renderPending = false;
  $("#top").innerHTML = headerHTML();
  main.classList.toggle("enter", state.enter); state.enter = false;
  if (state.phase === "loading") { main.innerHTML = `<div class="loading">${avatarSVG({}, 0, { live: true })}<p class="disp">Getting your quest ready…</p></div>`; return; }
  if (state.phase === "join") { main.innerHTML = viewEditor(true); return; }
  if (state.tab === "me" && !state.draft && state.me) state.draft = draftFrom(state.me);
  const v = { today: viewToday, journey: viewJourney, plan: viewPlan, group: viewGroup, victories: viewVictories, me: () => viewEditor(false), leader: viewLeader }[state.tab] || viewToday;
  main.innerHTML = v();
  animateValues();
  if (state.tab === "group") { const t = $("#track"), m = $("#trackme"); if (t && m) t.scrollLeft = Math.max(0, m.parentElement.offsetLeft - t.clientWidth / 2); }
}
document.addEventListener("focusout", () => setTimeout(() => { if (state.renderPending) render(); }, 0));

function setTab(t) {
  if (!TABS.some(([k]) => k === t) || (t === "leader" && !state.canLead)) t = "today";
  if (t === "me" && state.me) state.draft = draftFrom(state.me);
  if (t !== state.tab) state.enter = true;
  state.tab = t; state.confirmRemove = null; render(true); window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}
function draftFrom(p) {
  const L = normLook(p.look, stats(p).n);
  const all = [...NAMES_M, ...NAMES_F];
  const place = PLACES.find(pl => pl && p.alias.endsWith(" " + pl)) || "";
  const name = place ? p.alias.slice(0, -(place.length + 1)) : p.alias;
  return { gender: p.gender, name: all.includes(name) ? name : "", place, team: p.team, look: { ...L } };
}
function newDraft() {
  const g = Math.random() < 0.5 ? "m" : "f";
  return { gender: g, name: "", place: "", team: "", look: { skin: Math.floor(Math.random() * SKINS.length), hair: g === "f" ? 1 : 0, hairColor: Math.floor(Math.random() * 4), beard: false, tunic: Math.floor(Math.random() * 4), sash: 0, hat: 0, item: 0 } };
}

/* ---------- celebrations ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $("#toast"); t.hidden = true; void t.offsetWidth; t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}
function confetti(x, y, count = 36) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#F0562A", "#FF9A3C", "#F5B301", "#0E9C8D", "#2F7BF0", "#7C4DFF", "#E11D48"];
  for (let i = 0; i < count; i++) {
    const b = document.createElement("div"); b.className = "confetti";
    const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.1, sp = 90 + Math.random() * 160;
    b.style.cssText = `left:${x}px;top:${y}px;background:${cols[i % cols.length]};--dx:${Math.cos(a) * sp}px;--dy:${Math.sin(a) * sp + 160 + Math.random() * 120}px;--r:${(Math.random() - 0.5) * 900}deg;animation-delay:${Math.random() * 0.08}s`;
    document.body.appendChild(b); setTimeout(() => b.remove(), 1700);
  }
}
const revealQueue = [];
function queueReveal(r) { revealQueue.push(r); if (revealQueue.length === 1) showReveal(); }
function showReveal() {
  const r = revealQueue[0], el = $("#reveal");
  if (!r) { el.hidden = true; el.innerHTML = ""; return; }
  el.innerHTML = `<div class="reveal-card"><div class="reveal-art">${r.art}</div><p class="kicker">${esc(r.kicker)}</p><h2 id="reveal-title">${esc(r.title)}</h2>
    <p class="muted">${esc(r.text)}</p><div class="row" style="justify-content:center;margin-top:6px">${r.action ? `<button class="btn go" data-reveal="act">${esc(r.action)}</button>` : ""}<button class="btn ${r.action ? "" : "go"}" data-reveal="close">${revealQueue.length > 1 ? "Next" : "Awesome"}</button></div></div>`;
  el.hidden = false;
  const rc = el.querySelector(".reveal-card").getBoundingClientRect();
  setTimeout(() => confetti(rc.left + rc.width / 2, rc.top + 40, 44), 150);
  el.querySelector("[data-reveal]").focus();
}
function closeReveal(act) {
  const r = revealQueue.shift();
  if (act && r && r.onAct) r.onAct();
  showReveal();
}

/* ---------- actions ---------- */
function toggleDay(day, el) {
  if (state.readOnly || !state.me) return;
  const before = stats(state.me);
  const done = { ...state.me.done };
  if (done[day]) delete done[day]; else done[day] = todayISO();
  state.me = { ...state.me, done };
  const after = stats(state.me);
  if (after.n > before.n) {
    state.cheerUntil = Date.now() + 2000;
    setTimeout(() => document.querySelectorAll(".av.cheer").forEach(a => a.classList.remove("cheer")), 2000);
    toast(`Day ${day} done · +${PLAN[day - 1].count} chapters`);
    if (el) { const r = el.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2); }
    STOPS.forEach((t, i) => { if (t.day > 0 && t.day === after.n) queueReveal({ kicker: i === STOPS.length - 1 ? "You made it to the Passover" : "New stop on your journey", title: t.place, text: t.title + ". " + t.verseRef + ".",
      art: `<svg class="medal" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4C20 4 11 13 11 25c0 16 21 35 21 35s21-19 21-35C53 13 44 4 32 4z" fill="var(--flame)"/><circle cx="32" cy="25" r="9" fill="#fff"/></svg>`,
      action: "Open the map", onAct: () => { state.stop = i; setTab("journey"); } }); });
    const vic = VICTORIES.find(v => v.day === after.n);
    if (vic) queueReveal({ kicker: "Victory Moment unlocked", title: vic.title, text: `${vic.ref} is ready for you. A story of God bringing his people through.`, art: victoryMedal(VICTORIES.indexOf(vic)), action: "Read the story", onAct: () => setTab("victories") });
    BADGES.filter(b => b.test(after) && !b.test(before)).forEach(b => queueReveal({ kicker: "Badge earned", title: b.name, text: b.desc + ".", art: medalIcon(b) }));
    for (const [k, arr] of Object.entries(UNLOCK)) arr.forEach(([label, , need], i) => {
      if (need === after.n && need > before.n) {
        const look = { ...normLook(state.me.look, after.n), [k]: i };
        queueReveal({ kicker: `New ${UNLOCK_NAMES[k]} unlocked`, title: label, text: `You read ${plural(after.n, "day")}. Try it on!`, art: avatarSVG(look, after.n, { live: true }), action: "Wear it",
          onAct: () => { state.me = { ...state.me, look }; saveMe(); toast(`Wearing ${label}`); render(true); } });
      }
    });
  }
  saveMe(); render(true);
}

async function joinOrSave() {
  const d = state.draft; if (!d || !d.name) return;
  const alias = (d.name + (d.place ? " " + d.place : "")).trim();
  if (takenAliases().has(alias.toLowerCase())) return;
  const base = state.me || { id: state.uid || "local", done: {}, createdAt: new Date().toISOString() };
  const n = stats({ done: base.done || {} }).n;
  state.me = { ...base, alias, gender: d.gender, team: state.config.teams.includes(d.team) ? d.team : "", look: normLook(d.look, n) };
  const joining = state.phase === "join";
  if (joining) { state.phase = "ready"; state.tab = "today"; state.enter = true; state.cheerUntil = Date.now() + 2000; }
  saveMe(); render(true);
  if (joining) { toast(`Welcome, ${alias}! Day 1 is ready.`); confetti(innerWidth / 2, innerHeight / 3, 50); }

}

document.addEventListener("keydown", e => { const st = e.target.closest && e.target.closest("g[data-stop]"); if (st && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); selectStop(+st.dataset.stop); } });

  const ds = t.dataset;
  if (ds.reveal) { closeReveal(ds.reveal === "act"); return; }
  if (ds.stopnav) { const cur = state.stop ?? Math.max(0, STOPS.findIndex(x => x.day > stats(state.me).n) - 1); selectStop(Math.max(0, Math.min(STOPS.length - 1, (cur < 0 ? STOPS.length - 1 : cur) + +ds.stopnav))); return; }
  if (ds.tab) { e.preventDefault(); setTab(ds.tab); return; }
  if (ds.toggle) { toggleDay(+ds.toggle, t); return; }
  if ("sel" in ds) { state.sel = ds.sel ? +ds.sel : null; render(true); if (state.sel) { const d = $("#daydetail"); if (d) d.scrollIntoView({ block: "nearest", behavior: "smooth" }); } return; }
  if (ds.askremove) { state.confirmRemove = ds.askremove; render(true); return; }
  if (ds.remove) { removePlayer(ds.remove); return; }
  const d = state.draft;
  if (!d) return;
  if (ds.gender) { d.gender = ds.gender; d.name = ""; }
  else if (ds.name) d.name = ds.name;
  else if (ds.team) d.team = d.team === ds.team ? "" : ds.team;
  else if (ds.beard) d.look.beard = !d.look.beard;
  else if (ds.look) {
    if (t.getAttribute("aria-disabled") === "true") { const need = UNLOCK[ds.look][+ds.val][2]; toast(`Read ${need} days to unlock this`); return; }
    d.look[ds.look] = +ds.val;
  } else if (ds.random) {
    const taken = takenAliases(), names = d.gender === "f" ? NAMES_F : NAMES_M;
    for (let i = 0; i < 60; i++) {
      const nm = names[Math.floor(Math.random() * names.length)], pl = Math.random() < 0.6 ? PLACES[1 + Math.floor(Math.random() * (PLACES.length - 1))] : "";
      if (!taken.has((nm + (pl ? " " + pl : "")).toLowerCase())) { d.name = nm; d.place = pl; break; }
    }
  } else if (ds.save) { joinOrSave(); return; }
  else return;
  render(true);
});
document.addEventListener("change", e => {
  if (e.target.id === "place" && state.draft) { state.draft.place = e.target.value; e.target.blur(); render(true); }
});
document.addEventListener("submit", e => { if (e.target.id === "leadform") saveConfig(e); });


/* ---------- boot ---------- */
function startLocal() {
  state.mode = "local"; state.canLead = true;
  state.config = normConfig(lsGet("nt70.config") || DEFAULT_CONFIG);
  const me = normPlayer(lsGet("nt70.me"), "local");
  state.me = me; state.playersLoaded = true;
  state.phase = me ? "ready" : "join";
  if (!me) state.draft = newDraft();
  const h = (location.hash || "").slice(1); if (me && h) state.tab = TABS.some(([k]) => k === h) ? h : "today";
  render(true);
}

async function boot() {
  render(true);
  const c = window.claude;
  if (!c || typeof c.use !== "function") { startLocal(); return; }
  let db = null, user = null;
  try { [db, user] = await Promise.all([c.use("db"), c.use("user")]); } catch {}
  const uid = user ? await user.id().catch(() => null) : null;
  if (!db || !uid) { startLocal(); return; }
  state.mode = "shared"; state.db = db; state.user = user; state.uid = uid;
  const [canEdit, isOwner, canWrite] = await Promise.all([user.canEdit().catch(() => false), user.isOwner().catch(() => false), user.can("data.write").catch(() => null)]);
  state.canLead = canEdit || isOwner; state.isOwner = isOwner; if (canWrite === false) state.readOnly = true;
  const h = (location.hash || "").slice(1); if (h) state.tab = TABS.some(([k]) => k === h) ? h : "today";

  db.doc("config/plan").onSnapshot(snap => {
    state.config = normConfig(snap.exists ? snap.data() : DEFAULT_CONFIG);
    if (state.phase !== "loading") render();
  }, () => {});

  db.collection("players").onSnapshot(snap => {
    const players = {};
    snap.docs.forEach(d => { const p = normPlayer(d.data(), d.id); if (p) players[d.id] = p; });
    state.players = players;
    const mine = players[uid];
    if (mine && !savePending()) state.me = mine;
    if (!state.playersLoaded && !snap.metadata.fromCache) {
      state.playersLoaded = true;
      if (state.me) state.phase = "ready";
      else { state.phase = "join"; state.draft = newDraft(); }
    } else if ((state.phase === "loading" || state.phase === "join") && mine) { state.me = mine; state.phase = "ready"; }
    if (state.phase === "ready" && state.tab === "me" && !state.draft) state.draft = draftFrom(state.me);
    render();
  }, err => {
    if (state.phase === "loading") { startLocal(); toast("Couldn't reach the group. Playing solo for now."); }
  });

  setTimeout(() => { if (state.phase === "loading" && !state.playersLoaded) { state.playersLoaded = true; state.phase = state.me ? "ready" : "join"; if (!state.me) state.draft = newDraft(); render(true); } }, 8000);
}
boot();
})();
</script>
