<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F0562A"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="NT70 Quest"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="firebase-config.js"></script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>NT70 Reading Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: game quest-log shell. Dark lamplit ground, leather-dark panels with bronze hairlines, Roman-inscription serif titles, parchment text, gold for progress. Single deliberate dark theme. */
:root {
  --bg: #0E0B09;
  --surface: #1A1512;
  --surface-2: #241D18;
  --ink: #ECE1CA;
  --muted: #A8977C;
  --line: #3E3227;
  --bronze: #8C6A3E;
  --flame: #C8572F;
  --flame-2: #E0913A;
  --gold: #D9AE55;
  --gold-hi: #F2D58C;
  --teal: #8DA35E;
  --violet: #9A6AAE;
  --rose: #C2533F;
  --sky: #8FA8DC;
  --on: #1A120B;
  --gold-ink: #22170A;
  --sec-g: #8DA35E; --sec-a: #C8692F; --sec-p: #D3A24A; --sec-l: #7F8BD0; --sec-r: #B9493D;
  --shadow: 0 1px 0 rgba(255,230,190,.04) inset, 0 18px 40px -18px rgba(0,0,0,.9);
  --shadow-lg: 0 30px 80px -20px rgba(0,0,0,.95);
  --radius: 10px;
  --sea: #7E9C98; --sea-ink: #3F5F5C; --land: #D8C399; --land-2: #C6AC78; --hill: #AF9060; --hill-2: #937549; --tree: #6E7F42; --map-ink: #4A3721;
  --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --font-body: "Alegreya Sans", "Gill Sans", system-ui, sans-serif;
  --step--1: 0.85rem; --step-0: 1.0625rem; --step-1: 1.3rem; --step-2: 1.7rem; --step-3: 2.5rem;
  --ease: cubic-bezier(.2,.8,.2,1);
  --spring: cubic-bezier(.34,1.4,.64,1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: radial-gradient(120% 60% at 50% -10%, #3A2716 0%, rgba(58,39,22,0) 60%), radial-gradient(80% 50% at 100% 100%, #1E1410 0%, rgba(30,20,16,0) 70%), var(--bg); background-attachment: fixed; color: var(--ink); font-family: var(--font-body); font-size: var(--step-0); line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #120E0B; }
h1, h2, h3, .disp { font-family: var(--font-display); font-weight: 700; letter-spacing: .02em; text-wrap: balance; margin: 0; line-height: 1.15; color: var(--ink); }
h2 { font-size: var(--step-2); }
h3 { font-size: var(--step-1); font-weight: 600; }
p { margin: 0; }
a { color: var(--gold); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: linear-gradient(#17120E, #120E0B); border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 rgba(217,174,85,.08), 0 10px 30px -10px #000; }
.bar { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.brand-mark { width: 40px; height: 40px; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--gold-hi), var(--gold) 45%, #7A5520 100%); color: #2A1A08; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 14px; box-shadow: 0 0 0 2px #2A1F16, 0 0 0 3px var(--bronze), 0 6px 18px -6px rgba(217,174,85,.6); }
.brand h1 { font-size: var(--step-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .06em; }
.brand small { display: block; font-family: var(--font-body); font-weight: 500; font-size: var(--step--1); color: var(--muted); letter-spacing: .02em; }
.mepill { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 14px 3px 3px; cursor: pointer; min-width: 0; }
.mepill .bubble { width: 36px; height: 36px; }
.mepill span:not(.bubble) { font-family: var(--font-display); font-weight: 600; font-size: var(--step--1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
.tabs { display: flex; gap: 2px; padding-block: 0; }
.tabs button { position: relative; display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; padding: 10px 14px 12px; font-family: var(--font-display); font-weight: 600; font-size: var(--step--1); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; transition: color .2s; }
.tabs button svg { width: 17px; height: 17px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-current="page"] { color: var(--gold); }
.tabs button[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

main { padding-block: 24px 72px; display: grid; gap: 18px; }
main.enter > * { animation: rise .55s var(--ease) both; }
main.enter > *:nth-child(2) { animation-delay: .06s; } main.enter > *:nth-child(3) { animation-delay: .12s; }
main.enter > *:nth-child(4) { animation-delay: .18s; } main.enter > *:nth-child(5) { animation-delay: .24s; } main.enter > *:nth-child(n+6) { animation-delay: .3s; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* Panels */
.card { position: relative; background: linear-gradient(180deg, #211A15, #18130F); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; min-width: 0; }
.card::before { content: ""; position: absolute; inset: 4px; border: 1px solid rgba(217,174,85,.07); border-radius: 7px; pointer-events: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }
.eyebrow { font-family: var(--font-display); font-size: .74rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
.note { border-radius: 8px; padding: 12px 16px; background: rgba(217,174,85,.08); border: 1px solid rgba(217,174,85,.22); color: var(--ink); }
.note.warn { background: rgba(194,83,63,.12); border-color: rgba(194,83,63,.4); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); border-radius: 6px; background: linear-gradient(#2B231C, #211A15); padding: 10px 18px; font-family: var(--font-display); font-weight: 600; font-size: var(--step--1); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; text-decoration: none; color: var(--ink); transition: transform .15s var(--spring), filter .2s, box-shadow .2s; box-shadow: 0 1px 0 rgba(255,230,190,.06) inset; }
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: scale(.97); }
.btn svg { width: 17px; height: 17px; }
.btn.go { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, #A57A2E); color: var(--gold-ink); border-color: #6E4F1E; box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 -2px 0 rgba(0,0,0,.2) inset, 0 10px 26px -12px rgba(217,174,85,.8); text-shadow: 0 1px 0 rgba(255,240,200,.4); }
.btn.dark { background: linear-gradient(#ECE1CA, #CDBF9F); color: #23190E; border-color: #8C7A58; }
.btn.big { font-size: var(--step-0); padding: 14px 24px; }
.btn.sm { padding: 7px 12px; font-size: .72rem; }
.btn.danger { background: linear-gradient(#B04A39, #8A3326); color: #fff; border-color: #5E2219; }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; filter: none; }
.btn.done-state { background: rgba(141,163,94,.14); color: var(--teal); border-color: rgba(141,163,94,.4); }

.chip { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; padding: 3px 9px; font-size: .78rem; font-weight: 700; letter-spacing: .03em; background: var(--surface-2); border: 1px solid var(--line); }
.chip svg { width: 14px; height: 14px; flex: none; }
.chip.sec { background: color-mix(in srgb, var(--sc) 14%, transparent); color: var(--sc); border-color: color-mix(in srgb, var(--sc) 40%, transparent); }
.chip.ok { background: rgba(141,163,94,.14); color: var(--teal); border-color: rgba(141,163,94,.4); }
.chip.behind { background: rgba(194,83,63,.14); color: #E07E69; border-color: rgba(194,83,63,.4); }
.sec-g { --sc: var(--sec-g); } .sec-a { --sc: var(--sec-a); } .sec-p { --sc: var(--sec-p); } .sec-l { --sc: var(--sec-l); } .sec-r { --sc: var(--sec-r); }

/* Portraits, frames and figures */
.av { display: block; overflow: visible; }
.pt .pt-body { transform-origin: 100px 240px; }
.pt .pt-head { transform-origin: 100px 140px; }
.pt .pt-eyes { transform-origin: 100px 92px; }
.pt.live .pt-body { animation: breathe 4.2s ease-in-out infinite; animation-delay: var(--d, 0s); }
.pt.live .pt-head { animation: sway 7s ease-in-out infinite; animation-delay: var(--d, 0s); }
.pt.live .pt-eyes { animation: blink 5.5s infinite; animation-delay: var(--d, 0s); }
.pt.cheer .pt-head { animation: lift 1.6s var(--ease) 1; }
.fg .fg-body { transform-origin: 30px 78px; }
.fg.live .fg-body { animation: sway-fig 5s ease-in-out infinite; animation-delay: var(--d, 0s); }
.fg.cheer .fg-body { animation: hop .9s var(--ease) 2; }
.av .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .45s ease-in-out infinite alternate; }
@keyframes breathe { 50% { transform: translateY(-1.2px) scaleY(1.006); } }
@keyframes sway { 30% { transform: rotate(-.8deg); } 70% { transform: rotate(.7deg); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
@keyframes lift { 35% { transform: rotate(-2.5deg) translateY(-3px); } }
@keyframes sway-fig { 50% { transform: rotate(1.2deg); } }
@keyframes hop { 40% { transform: translateY(-5px); } }
@keyframes flicker { to { transform: scale(1.15, .88); } }
.bubble { border-radius: 50%; background: radial-gradient(circle at 50% 30%, #4A3420, #1E1712 75%); overflow: hidden; flex: none; display: block; box-shadow: 0 0 0 1px var(--bronze), 0 0 0 3px #1A1410; }
.bubble .av { width: 100%; height: 100%; }
.frame { position: relative; aspect-ratio: 5 / 6; width: 100%; max-width: 100%; border-radius: 8px; overflow: hidden;
  background: radial-gradient(70% 55% at 50% 38%, #6A4527 0%, #3A2617 45%, #160F0B 100%);
  box-shadow: 0 0 0 1px #6E5330, 0 0 0 4px #1A1410, 0 0 0 5px var(--bronze), 0 20px 40px -18px #000; }
.frame::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 40% at 30% 18%, rgba(255,200,120,.22), transparent 70%); pointer-events: none; z-index: 1; }
.frame::after { content: ""; position: absolute; inset: 6px; border: 1px solid rgba(217,174,85,.25); border-radius: 4px; pointer-events: none; z-index: 2; }
.frame > .pt { position: absolute; inset: 0; width: 100%; height: 100%; }
.frame-fig { position: absolute; right: 8px; bottom: 6px; width: 22%; aspect-ratio: 3 / 4; z-index: 3; filter: drop-shadow(0 2px 4px rgba(0,0,0,.7)); }
.frame-fig .av { width: 100%; height: 100%; }
.frame.glow { box-shadow: 0 0 0 1px #6E5330, 0 0 0 4px #1A1410, 0 0 0 5px var(--gold), 0 0 50px -6px rgba(242,213,140,.7); transition: box-shadow .6s; }

/* Today */
.hero { display: grid; grid-template-columns: 230px 1fr; gap: 28px; align-items: center; }
.hero-day { font-size: var(--step-3); color: var(--gold-hi); text-shadow: 0 2px 18px rgba(217,174,85,.25); }
.hero-read { font-size: var(--step-2); font-family: var(--font-display); font-weight: 500; line-height: 1.15; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { background: linear-gradient(180deg, #211A15, #18130F); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: var(--step-2); font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums lining-nums; color: var(--gold-hi); }
.stat b small { font-size: var(--step-0); color: var(--muted); font-weight: 500; }
.stat .sl { font-size: var(--step--1); color: var(--muted); }
.stat .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 6px; border: 1px solid currentColor; }
.stat .ic svg { width: 15px; height: 15px; }
.meter { height: 10px; border-radius: 999px; background: #0E0B09; border: 1px solid var(--line); position: relative; overflow: hidden; box-shadow: 0 1px 2px #000 inset; }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: linear-gradient(90deg, #8A5A22, var(--gold), var(--gold-hi)); box-shadow: 0 0 12px rgba(242,213,140,.5); transition: width 1.1s var(--ease); }
.meter i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); transform: translateX(-100%); animation: shine 3s ease-in-out infinite 1s; }
@keyframes shine { 60%, 100% { transform: translateX(100%); } }
.catch { display: flex; flex-wrap: wrap; gap: 8px; }

/* Badges */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.badge { display: grid; grid-template-columns: 42px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: rgba(0,0,0,.25); border: 1px solid var(--line); }
.badge.locked { opacity: .45; }
.badge.locked .medal-ic { filter: grayscale(1) brightness(.7); }
.medal-ic { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: #2A1A08; background: radial-gradient(circle at 35% 30%, var(--gold-hi), var(--gold) 50%, #7A5520); box-shadow: 0 0 0 2px #1A1410, 0 0 0 3px var(--bc), 0 4px 12px -4px rgba(0,0,0,.8); }
.medal-ic svg { width: 20px; height: 20px; }
.badge b { display: block; font-family: var(--font-display); font-size: .8rem; font-weight: 600; line-height: 1.2; }
.badge > div span { font-size: .78rem; color: var(--muted); line-height: 1.2; display: block; }

/* Plan grid */
.week { display: grid; gap: 8px; }
.week + .week { margin-top: 18px; }
.week-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; align-items: baseline; }
.week-head h3 { font-size: var(--step-0); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.tile { position: relative; border: 1px solid var(--line); border-radius: 6px; background: linear-gradient(#1F1813, #17120E); min-height: 72px; padding: 8px; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; transition: transform .2s var(--spring), background .25s, box-shadow .2s, border-color .2s; box-shadow: inset 0 2px 0 var(--sc); }
.tile:hover { transform: translateY(-2px); border-color: var(--bronze); }
.tile .n { font-family: var(--font-display); font-weight: 700; font-size: var(--step-1); line-height: 1; }
.tile .r { font-size: .72rem; line-height: 1.15; overflow-wrap: anywhere; color: var(--muted); }
.tile .ck { position: absolute; right: 6px; top: 7px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,.25); display: grid; place-items: center; }
.tile .ck svg { width: 12px; height: 12px; }
.tile.done { background: linear-gradient(180deg, color-mix(in srgb, var(--sc) 85%, #fff 15%), var(--sc)); color: #170F08; border-color: color-mix(in srgb, var(--sc) 60%, #000); box-shadow: 0 6px 16px -10px var(--sc); }
.tile.done .r { color: rgba(23,15,8,.75); }
.tile.today { box-shadow: inset 0 2px 0 var(--sc), 0 0 0 2px var(--gold), 0 0 18px -2px rgba(242,213,140,.55); }
.tile.sel { box-shadow: 0 0 0 2px var(--ink); }
.tile.vic::before { content: ""; position: absolute; left: 8px; bottom: 8px; width: 8px; height: 8px; transform: rotate(45deg); background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.tile.done.vic::before { background: #170F08; box-shadow: none; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }

/* Group */
.teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.team { border-radius: 8px; padding: 14px; background: rgba(0,0,0,.25); border: 1px solid var(--line); display: grid; gap: 8px; }
.team h3 { display: flex; align-items: center; gap: 8px; font-size: var(--step-0); }
.team .meter i { background: var(--tc); box-shadow: none; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
.rank1 { font-family: var(--font-display); font-size: .62rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; background: var(--gold); color: var(--gold-ink); }
.track-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--line); background: linear-gradient(180deg, #2A1D13 0%, #1A1410 70%); scrollbar-width: thin; }
.track { display: grid; grid-template-columns: repeat(71, 34px); align-items: end; width: max-content; padding: 10px 14px 12px; position: relative; }
.track::after { content: ""; position: absolute; left: 31px; right: 31px; bottom: 21px; height: 3px; background: repeating-linear-gradient(90deg, var(--bronze) 0 6px, transparent 6px 10px); z-index: 0; opacity: .7; }
.tcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; position: relative; z-index: 1; }
.tcol .ppl { display: flex; flex-direction: column-reverse; align-items: center; min-height: 52px; }
.tcol .ppl > span + span { margin-bottom: -20px; }
.tcol .av { width: 30px; height: 40px; }
.tcol .more { font-size: .65rem; font-weight: 800; }
.tdot { width: 10px; height: 10px; border-radius: 50%; background: #1A1410; border: 2px solid var(--bronze); }
.tdot.mile { width: 16px; height: 16px; border-radius: 2px; transform: rotate(45deg); background: var(--gold); border-color: #1A1410; box-shadow: 0 0 10px rgba(242,213,140,.6); }
.tdot.go { width: 16px; height: 16px; background: var(--teal); border-color: #1A1410; }
.tdot.me { background: var(--flame-2); border-color: #1A1410; box-shadow: 0 0 0 3px rgba(224,145,58,.4), 0 0 12px var(--flame-2); }
.tlabel { font-size: .62rem; font-weight: 700; color: var(--muted); height: 12px; line-height: 12px; }
.board { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 26px 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; border-radius: 8px; padding: 8px 12px; background: rgba(0,0,0,.22); border: 1px solid var(--line); }
.prow.me { background: rgba(217,174,85,.08); border-color: rgba(217,174,85,.4); }
.prow .rank { font-family: var(--font-display); font-weight: 700; font-size: var(--step-1); text-align: center; font-variant-numeric: tabular-nums lining-nums; color: var(--muted); }
.prow:nth-child(-n+3) .rank { color: var(--gold); }
.prow .bubble { width: 46px; height: 46px; }
.prow .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-display); font-weight: 600; }
.prow .who span { font-size: var(--step--1); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.prow .nums { text-align: right; font-variant-numeric: tabular-nums; font-size: var(--step--1); color: var(--muted); display: grid; justify-items: end; gap: 4px; }
.prow .nums b { font-family: var(--font-display); font-size: var(--step-1); color: var(--gold-hi); line-height: 1; }

/* Victories */
.vics { display: grid; gap: 16px; }
.vic { display: grid; grid-template-columns: 76px 1fr; gap: 20px; }
.vic .medal { width: 76px; height: 76px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
.vic.locked { background: #120E0B; }
.vic.locked .medal { filter: grayscale(1) brightness(.6); }
.vic blockquote, .stop-card blockquote { margin: 0; padding: 14px 18px; border-radius: 6px; background: linear-gradient(180deg, #E9DCC0, #D8C7A2); color: #2A1C0E; font-family: var(--font-display); font-weight: 500; font-size: var(--step-1); line-height: 1.35; box-shadow: 0 0 0 1px #8C7450 inset, 0 10px 20px -12px #000; }

const BOOKS = [
  ["Matthew",28,"g","Mt"],["Mark",16,"g","Mk"],["Luke",24,"g","Lk"],["John",21,"g","Jn"],["Acts",28,"a","Acts"],

const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16), ch = [n >> 16, (n >> 8) & 255, n & 255];
  return "#" + ch.map(v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt))).toString(16).padStart(2, "0")).join("");
};

/* ---------- avatar ---------- */
function normLook(l, n) {
  l = l && typeof l === "object" ? l : {};
  const g = l.g === "f" ? "f" : "m";
  const pick = (v, arr) => Number.isInteger(v) && v >= 0 && v < arr.length ? v : 0;
  const gated = (v, key) => { const ok = allowedFor(key, g).filter(([e]) => e[2] <= n).map(([, i]) => i); return ok.includes(v) ? v : ok[0]; };
  const beard = g === "f" ? 0 : l.beard === true ? 3 : pick(l.beard, BEARDS);
  return { g, skin: pick(l.skin, SKINS), hair: pick(l.hair, HAIRS), hairColor: pick(l.hairColor, HAIRC), beard,
    tunic: gated(l.tunic, "tunic"), sash: gated(l.sash, "sash"), hat: gated(l.hat, "hat"), item: gated(l.item, "item"),
    face: pick(l.face, FACES), eyes: pick(l.eyes, EYES), eyeColor: pick(l.eyeColor, EYEC), brows: pick(l.brows, BROWS), mouth: pick(l.mouth, MOUTHS),
    cover: pick(l.cover, COVERS[g]), mantle: pick(l.mantle, MANTLES[g]), jewel: g === "f" ? pick(l.jewel, JEWELS) : 0 };
}
const mixHex = (a, b, t) => {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => [(s >> 16) & 255, (s >> 8) & 255, s & 255];
  return "#" + ch(pa).map((v, i) => Math.round(v + (ch(pb)[i] - v) * t).toString(16).padStart(2, "0")).join("");
};
let AVN = 0;

// opts.portrait / opts.bust / opts.vb draw the painted portrait; otherwise the small full-body figure (map, road).
function avatarSVG(look, n, opts = {}) {
  return opts.portrait || opts.bust || opts.vb ? portraitSVG(look, n, opts) : figureSVG(look, n, opts);
}

function portraitSVG(look, n, opts = {}) {
  const L = normLook(look, n), u = "p" + (++AVN), f = L.g === "f";
  const skin = SKINS[L.skin], sL = shade(skin, 0.13), sD = shade(skin, -0.2), sDD = shade(skin, -0.38);
  const hc = HAIRC[L.hairColor], hL = shade(hc, 0.22), hD = shade(hc, -0.35);
  const tunic = UNLOCK.tunic[L.tunic][1], [, mantle, accent] = MANTLES[L.g][L.mantle];
  const cover = COVERS[L.g][L.cover][1], hat = UNLOCK.hat[L.hat][1], hair = HAIRS[L.hair][1], beard = BEARDS[L.beard][1];
  let [fw, cw, jw, cy, chw] = FACES[L.face][1];
  if (f) { jw -= 3; chw -= 2; cw -= 1; cy -= 1; } else { jw += 2; chw += 1; }
  const faceD = `M100 50 C${100 + fw * 0.62} 50 ${100 + fw} 58 ${100 + fw} 72 C${100 + fw} 83 ${100 + cw} 88 ${100 + cw} 98 C${100 + cw} 110 ${100 + jw + 3} 116 ${100 + jw} 122 C${100 + jw - 5} 129 ${100 + chw} ${cy} 100 ${cy} C${100 - chw} ${cy} ${100 - jw + 5} 129 ${100 - jw} 122 C${100 - jw - 3} 116 ${100 - cw} 110 ${100 - cw} 98 C${100 - cw} 88 ${100 - fw} 83 ${100 - fw} 72 C${100 - fw} 58 ${100 - fw * 0.62} 50 100 50 Z`;
  const S = (d, c, w, extra = "") => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
  const P = (d, fill, extra = "") => `<path d="${d}" fill="${fill}" ${extra}/>`;
  const fold = (d, w = 2.4, o = 0.22) => S(d, "#000", w, `opacity="${o}" filter="url(#sb${u})"`);
  const hi = (d, w = 2, o = 0.14) => S(d, "#fff", w, `opacity="${o}" filter="url(#sb${u})"`);
  const sw = f ? 68 : 80; // shoulder half-width

    <linearGradient id="gd${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4D58A"/><stop offset=".5" stop-color="#C99A3E"/><stop offset="1" stop-color="#8A6424"/></linearGradient>

  </defs>`;

  // ---- garments ----
  const torso = `M${100 - 14} 148 Q${100 - sw * 0.45} 156 ${100 - sw + 14} 166 Q${100 - sw - 2} 176 ${100 - sw - 6} 204 L${100 - sw - 10} 240 L${100 + sw + 10} 240 L${100 + sw + 6} 204 Q${100 + sw + 2} 176 ${100 + sw - 14} 166 Q${100 + sw * 0.45} 156 ${100 + 14} 148 Z`;

    body += P("M84 150 Q100 166 116 150 L114 147 Q100 160 86 147 Z", skin) + S("M83 151 Q100 168 117 151", accent || "#C9A04B", 3.2, 'opacity=".9"')

      ${beard === "stubble" ? `<path d="M88 116 Q100 111 112 116 L112 118 Q100 114 88 118 Z" fill="${hc}" opacity=".3" filter="url(#sb${u})"/>` : ""}
    </g>`;
  const face = P(faceD, `url(#sk${u})`) + shading + S(faceD, sDD, 0.8, 'opacity=".35"');

// Small full-body figure for the map and the road (viewBox 60 x 80, feet at the bottom).
function figureSVG(look, n, opts = {}) {

function segCtrl(k) {
  const a = STOPS[k], b = STOPS[k + 1], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
  const off = (k % 2 ? 1 : -1) * Math.min(28, len * 0.16);
  return { x: mx - dy / len * off, y: my + dx / len * off };
}
function journeyPos(n) {
  n = Math.max(0, Math.min(DAYS, n));
  for (let k = 0; k < STOPS.length - 1; k++) {
    if (n < STOPS[k + 1].day) { const t = (n - STOPS[k].day) / (STOPS[k + 1].day - STOPS[k].day); return { k, t, ...qpt(STOPS[k], segCtrl(k), STOPS[k + 1], t) }; }
  }
  const last = STOPS[STOPS.length - 1]; return { k: STOPS.length - 1, t: 0, x: last.x, y: last.y };
}
function routePath(n) {
  const p = journeyPos(n); let d = `M${STOPS[0].x} ${STOPS[0].y}`;
  for (let k = 0; k < p.k && k < STOPS.length - 1; k++) { const c = segCtrl(k); d += ` Q${c.x.toFixed(1)} ${c.y.toFixed(1)} ${STOPS[k + 1].x} ${STOPS[k + 1].y}`; }
  if (p.k < STOPS.length - 1 && p.t > 0) { const a = STOPS[p.k], c = segCtrl(p.k), c1 = { x: a.x + (c.x - a.x) * p.t, y: a.y + (c.y - a.y) * p.t }; d += ` Q${c1.x.toFixed(1)} ${c1.y.toFixed(1)} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`; }
  return d;
}
const fullRoute = () => routePath(DAYS);
const placeAvatar = (svg, x, y, w) => svg.replace("<svg ", `<svg x="${(x - w / 2).toFixed(1)}" y="${(y - w * 4 / 3 + 3).toFixed(1)}" width="${w}" height="${(w * 4 / 3).toFixed(1)}" `);

function mapSVG(opts = {}) {
  const myN = state.me ? stats(state.me).n : 0;
  const sel = state.stop;
  const hills = [[200, 250], [225, 262], [188, 372], [210, 384], [176, 470], [196, 490], [232, 300], [168, 410], [245, 345], [320, 300], [330, 420], [312, 120], [205, 120]]
    .map(([x, y]) => `<path d="M${x - 9} ${y} L${x} ${y - 9} L${x + 9} ${y} Z" fill="var(--hill)"/><path d="M${x} ${y - 9} L${x + 9} ${y} L${x + 3} ${y} Z" fill="var(--hill-2)"/>`).join("");
  const trees = [[240, 230], [250, 238], [190, 210], [300, 260], [306, 268], [232, 335], [180, 340], [258, 120], [315, 175], [150, 400]]
    .map(([x, y]) => `<rect x="${x - 1}" y="${y}" width="2" height="5" fill="var(--map-ink)" opacity=".5"/><circle cx="${x}" cy="${y - 2}" r="5" fill="var(--tree)"/>`).join("");
  const waves = [[60, 120], [40, 200], [80, 330], [30, 420], [50, 500], [110, 60]].map(([x, y]) => `<path d="M${x} ${y} q5 -4 10 0 t10 0" fill="none" stroke="var(--sea-ink)" stroke-width="1.4" opacity=".45"/>`).join("");
  const stops = STOPS.map((s, i) => {
    const reached = myN >= s.day, next = !reached && (i === 0 || myN >= STOPS[i - 1].day), last = i === STOPS.length - 1;
    const r = last ? 9 : 6;
    const label = s.la === "none" ? "" : `<text x="${s.x + s.lx}" y="${s.y + s.ly}" text-anchor="${s.la}" class="m-town${last ? " big" : ""}">${esc(s.place)}</text>`;
    const attrs = opts.mini ? "" : ` data-stop="${i}" tabindex="0" role="button" aria-label="${esc(s.place)}: ${esc(s.title)}${reached ? ", reached" : `, at day ${s.day}`}"`;
    return `<g class="m-stop${reached ? " reached" : ""}${next ? " next" : ""}${sel === i && !opts.mini ? " sel" : ""}"${attrs}>
      ${next ? `<circle cx="${s.x}" cy="${s.y}" r="${r + 4}" class="m-pulse"/>` : ""}
      <circle cx="${s.x}" cy="${s.y}" r="${r + 7}" fill="transparent"/>
      <circle cx="${s.x}" cy="${s.y}" r="${r}" class="m-dot"/>
      ${last ? `<path d="M${s.x - 4} ${s.y + 1} l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="${reached ? 1 : 0}"/><path d="M${s.x - 5} ${s.y - 14} h10 v-3 l-2.5 2 l-2.5 -4 l-2.5 4 l-2.5 -2 z" fill="var(--gold)"/>` : ""}
      ${label}</g>`;
  }).join("");
  // characters
  const people = allPlayers();
  const buckets = new Map();
  people.forEach(p => { if (state.me && p.id === state.me.id) return; const key = p.s.n; (buckets.get(key) || buckets.set(key, []).get(key)).push(p); });
  let crowd = "";
  buckets.forEach((ps, n) => {
    const pos = journeyPos(n);
    ps.slice(0, 5).forEach((p, j) => { const ox = (j % 2 ? 1 : -1) * Math.ceil(j / 2) * 9; crowd += `<g class="m-person"><title>${esc(p.alias)} · ${p.s.n} days</title>${placeAvatar(avatarSVG(p.look, p.s.n), pos.x + ox, pos.y, 22)}</g>`; });
    if (ps.length > 5) crowd += `<text x="${pos.x + 26}" y="${pos.y - 18}" class="m-more">+${ps.length - 5}</text>`;
  });
  let meSVG = "";
  if (state.me) {
    const pos = journeyPos(myN);
    meSVG = `<g class="m-me">${placeAvatar(avatarSVG(state.me.look, myN, { live: !opts.mini }), pos.x, pos.y, 34)}
      <g transform="translate(${pos.x.toFixed(1)} ${(pos.y - 52).toFixed(1)})"><rect x="-17" y="-9" width="34" height="14" rx="7" fill="var(--flame)"/><text x="0" y="1.5" text-anchor="middle" class="m-you">You</text></g></g>`;
  }
  let vb = "0 0 360 560";
  if (opts.mini) { const p = journeyPos(myN), w = 170, h = 120; vb = `${Math.max(0, Math.min(360 - w, p.x - w / 2)).toFixed(0)} ${Math.max(0, Math.min(560 - h, p.y - h / 2 - 12)).toFixed(0)} ${w} ${h}`; }
  return `<svg class="map" viewBox="${vb}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of the land of Israel showing Jesus' journey from Bethlehem to Jerusalem for the Passover">
    <rect width="360" height="560" fill="var(--sea)"/>${waves}
    <path d="M150 0 Q165 40 168 88 Q170 120 158 132 Q174 140 150 154 Q140 190 130 230 Q118 290 102 350 Q88 410 74 470 Q62 520 52 560 L360 560 L360 0 Z" fill="var(--land)"/>
    <path d="M150 0 Q165 40 168 88 Q170 120 158 132 Q174 140 150 154 Q140 190 130 230 Q118 290 102 350 Q88 410 74 470 Q62 520 52 560" fill="none" stroke="var(--land-2)" stroke-width="6" opacity=".9"/>
    <path d="M300 0 Q340 140 320 260 Q345 380 330 560 L360 560 L360 0 Z" fill="var(--land-2)" opacity=".55"/>
    ${hills}${trees}
    <path d="M292 62 Q285 85 282 101 M282 115 Q279 138 276 153 M275 197 Q262 230 276 262 Q262 300 274 340 Q262 380 270 430" fill="none" stroke="var(--sea-ink)" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="282" cy="108" rx="5" ry="7" fill="var(--sea)" stroke="var(--sea-ink)" stroke-width="1.5"/>
    <path d="M276 152 C292 152 291 175 287 188 C283 198 270 200 267 190 C262 176 264 156 276 152 Z" fill="var(--sea)" stroke="var(--sea-ink)" stroke-width="1.5"/>
    <path d="M270 430 C286 430 288 470 285 505 C283 530 270 540 264 525 C258 500 258 445 270 430 Z" fill="var(--sea)" stroke="var(--sea-ink)" stroke-width="1.5"/>
    <text x="74" y="270" class="m-sea" transform="rotate(-72 74 270)">THE GREAT SEA</text>
    <text x="298" y="214" class="m-water">Sea of</text><text x="298" y="224" class="m-water">Galilee</text>
    <text x="294" y="482" class="m-water">Salt Sea</text><text x="294" y="492" class="m-water">(Dead Sea)</text>
    <text x="284" y="318" class="m-water" transform="rotate(80 284 318)">Jordan</text>
    <text x="205" y="132" class="m-region">GALILEE</text><text x="168" y="290" class="m-region">SAMARIA</text>
    <text x="132" y="512" class="m-region">JUDAEA</text><text x="318" y="360" class="m-region" text-anchor="middle">PERAEA</text>
    <text x="316" y="240" class="m-region" text-anchor="middle">DECAPOLIS</text>
    <g transform="translate(30 40)"><circle r="16" fill="var(--surface)" opacity=".85"/><path d="M0 -12 L4 0 L0 -3 L-4 0 Z" fill="var(--flame)"/><path d="M0 12 L4 0 L0 3 L-4 0 Z" fill="var(--map-ink)" opacity=".5"/><text y="-17" text-anchor="middle" class="m-n">N</text></g>
    <path d="${fullRoute()}" fill="none" stroke="var(--map-ink)" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round" opacity=".55"/>
    <path d="${routePath(myN)}" fill="none" stroke="var(--flame)" stroke-width="3.5" stroke-linecap="round" class="m-walked"/>
    ${stops}${crowd}${meSVG}
  </svg>`;
}

function viewJourney() {
  const n = stats(state.me).n, pos = journeyPos(n);
  const nextI = STOPS.findIndex(s => s.day > n), next = STOPS[nextI];
  const sel = state.stop ?? (next ? Math.max(0, nextI - 1) : STOPS.length - 1);
  const s = STOPS[sel], open = n >= s.day || (state.canLead && state.mode === "shared");
  const card = `<div class="stop-card" id="stopcard"><div class="row between"><p class="eyebrow">Stop ${sel + 1} of ${STOPS.length} · ${n >= s.day ? "reached" : `day ${s.day}`}</p><span class="chip">${esc(s.ref)}</span></div>
    <h3>${esc(s.place)}: ${esc(s.title)}</h3>
    ${open ? `<p>${esc(s.text)}</p><blockquote>"${esc(s.verse)}"<span>${esc(s.verseRef)} · KJV</span></blockquote>
      <div class="row"><a class="btn sm" href="${readingURL(s.ref.split(";")[0], "KJV")}" target="_blank" rel="noopener">Read ${esc(s.ref.split(";")[0])} ${icon("ext")}</a></div>`
      : `<p class="muted">Read ${plural(s.day - n, "more day")} to walk here and unlock this stop.</p>`}
    <div class="row" style="justify-content:space-between"><button class="btn sm" data-stopnav="-1" ${sel === 0 ? "disabled" : ""}>Previous stop</button><button class="btn sm" data-stopnav="1" ${sel === STOPS.length - 1 ? "disabled" : ""}>Next stop</button></div></div>`;
  return `<section class="card stack"><div class="row between"><div><p class="eyebrow">Journey to the Passover</p><h2>From Bethlehem to Jerusalem</h2></div>
      <span class="chip">${icon("target")} ${next ? `${plural(next.day - n, "day")} to ${esc(next.place)}` : "Arrived in Jerusalem"}</span></div>
    <p class="muted small" style="max-width:68ch">Every day you read moves your character along the road Jesus walked. Finish all 70 days and you arrive in Jerusalem for the Passover. Tap a town to read what happened there.</p>
    <div class="meter"><i data-w="${n / DAYS * 100}" data-k="m-journey" style="width:${n / DAYS * 100}%"></i></div></section>
  <section class="journey"><div class="card map-card">${mapSVG()}</div><div class="card">${card}</div></section>
  <section class="card stack"><h3>All stops</h3><ol class="stoplist">${STOPS.map((t, i) => `<li class="${n >= t.day ? "reached" : ""}${i === sel ? " cur" : ""}"><button data-stop="${i}"><span class="sn">${n >= t.day ? icon("check") : i + 1}</span><span><b>${esc(t.place)}</b><span class="small muted">${esc(t.title)} · day ${t.day}</span></span></button></li>`).join("")}</ol></section>`;
}

/* ---------- views ---------- */
const dayDate = (start, day) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + day - 1);

function headerHTML() {
  const tabs = TABS.filter(([k]) => k !== "leader" || state.canLead);
  const me = state.me;
  return `<div class="wrap bar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">70</span><h1>NT70 Quest<small>${esc(state.config.groupName)} · New Testament in 70 days</small></h1></div>
      ${me ? `<button class="mepill" data-tab="me" aria-label="Edit my avatar"><span class="bubble">${avatarSVG(me.look, stats(me).n, { bust: true })}</span><span>${esc(me.alias)}</span></button>` : ""}
    </div>
    ${state.phase === "ready" ? `<nav class="tabs wrap" aria-label="Sections">${tabs.map(([k, l, s]) => `<button data-tab="${k}" ${state.tab === k ? 'aria-current="page"' : ""}>${icon(k)}<span class="lg">${l}</span><span class="sm-l">${s}</span></button>`).join("")}</nav>` : ""}`;
}

function viewToday() {
  const me = state.me, s = stats(me), pd = planDay(), start = parseISO(state.config.start);
  const target = pd !== null && pd >= 1 && pd <= DAYS ? pd : null;
  const focus = target && !s.doneSet.has(target) ? target : nextUndone(s);
  const behind = target ? PLAN.slice(0, target - 1).filter(d => !s.doneSet.has(d.day)) : [];
  const cheer = Date.now() < state.cheerUntil;
  let banner = "";
  if (!start) banner = state.canLead
    ? `<div class="note">Set the group's start date under <a href="#leader" data-tab="leader">Leader</a> so everyone shares one calendar. Until then, start with Day 1.</div>`
    : `<div class="note">Your leader hasn't set the start date yet. You can begin with Day 1 now.</div>`;
  else if (pd < 1) banner = `<div class="note">The quest starts ${fmtDate(start)}, in ${plural(1 - pd, "day")}. Reading ahead is allowed.</div>`;
  else if (pd > DAYS) banner = `<div class="note">The 70 days ended ${fmtDate(dayDate(start, DAYS))}. Finish any days you missed.</div>`;
  const pace = target ? (s.n >= target ? `<span class="chip ok">${icon("check")} On pace</span>` : `<span class="chip behind">${plural(target - s.n, "day")} behind</span>`) : "";

  let hero;
  const stage = `<div class="frame${cheer ? " glow" : ""}">${avatarSVG(me.look, s.n, { portrait: true, live: true, cheer })}<div class="frame-fig">${avatarSVG(me.look, s.n, { live: true })}</div></div>`;
  if (focus === null) {
    hero = `<div class="hero">${stage}<div class="stack">
      <p class="eyebrow">Quest complete</p><h2 class="hero-day">You read the whole New Testament!</h2>
      <p>260 chapters, Matthew to Revelation. Your Crown of Life is waiting on the Me page.</p></div></div>`;
  } else {
    const p = PLAN[focus - 1];
    const lead = target && focus !== target ? (focus > target ? "Today's reading is done · read ahead" : "Next up") : (target ? "Today's reading" : "Up next");
    const dateLine = start ? ` · ${fmtDate(dayDate(start, focus))}` : "";
    hero = `<div class="hero">${stage}<div class="stack" style="gap:14px">
      <div class="stack" style="gap:6px"><p class="eyebrow">${lead}${dateLine}</p><h2 class="hero-day">Day ${focus}</h2><p class="hero-read">${esc(p.label)}</p></div>
      <div class="row"><span class="chip sec sec-${p.sec}">${SECTIONS[p.sec]}</span><span class="chip">${icon("book")} ${plural(p.count, "chapter")}</span>${pace}</div>
      <div class="row">
        <button class="btn go big" data-toggle="${focus}" ${state.readOnly ? "disabled" : ""}>${icon("check")} I read Day ${focus}</button>
        <a class="btn" href="${readingURL(p.label, state.config.version)}" target="_blank" rel="noopener">Open Bible (${esc(state.config.version)}) ${icon("ext")}</a>
      </div></div></div>`;
  }
  const nv = VICTORIES.find(v => v.day > s.n);
  const pct = Math.round(s.chapters / TOTAL * 100);
  const stat = (k, val, unit, label, color, ic) => `<div class="stat"><span class="ic" style="background:color-mix(in srgb, ${color} 16%, var(--surface));color:${color}">${icon(ic)}</span><b><span data-count="${val}" data-k="${k}">${val}</span>${unit ? `<small>${unit}</small>` : ""}</b><span class="sl">${label}</span></div>`;
  return `${banner}
  ${state.readOnly ? `<div class="note warn">You can look around, but your progress can't be saved yet. Ask your leader to give you <b>Contributor</b> access to this page.</div>` : ""}
  ${state.writeError && !state.readOnly ? `<div class="note warn">Your last check-off didn't save (${esc(state.writeError)}). Check your connection and tap it again.</div>` : ""}
  <section class="card">${hero}</section>
  <section class="stats" aria-label="Your progress">
    ${stat("days", s.n, "/70", "days done", "var(--teal)", "plan")}
    ${stat("ch", s.chapters, "", "of 260 chapters", "var(--sky)", "book")}
    ${stat("streak", s.streak, "", `day streak · best ${s.best}`, "var(--flame)", "flame")}
    ${stat("pct", pct, "%", "of the New Testament", "var(--violet)", "target")}
  </section>
  <div class="meter" role="img" aria-label="${s.chapters} of 260 chapters"><i data-w="${s.chapters / TOTAL * 100}" data-k="m-main" style="width:${s.chapters / TOTAL * 100}%"></i></div>
  ${behind.length ? `<section class="card stack"><h3>Catch up</h3><p class="small muted">Tap a day to mark it read. Each one gets you closer to the group.</p>
    <div class="catch">${behind.map(d => `<button class="btn sm" data-toggle="${d.day}" ${state.readOnly ? "disabled" : ""}>Day ${d.day} · ${esc(d.short)}</button>`).join("")}</div></section>` : ""}
  ${tripCard(s.n)}
  ${nv ? `<section class="card row between">
      <div class="row" style="gap:14px;flex-wrap:nowrap;min-width:0">${victoryMedal(VICTORIES.indexOf(nv)).replace('class="medal"', 'class="medal" style="width:52px;height:52px;flex:none;filter:grayscale(.6);opacity:.8"')}
      <div style="min-width:0"><p class="eyebrow">Next Victory Moment · Day ${nv.day}</p><h3>${esc(nv.title)}</h3><p class="small muted">${plural(nv.day - s.n, "more day")} to unlock this story from ${esc(nv.ref)}.</p></div></div>
      <button class="btn sm" data-tab="victories">See victories</button></section>` : ""}
  <section class="card stack"><div class="row between"><h3>Badges</h3><span class="small muted">${BADGES.filter(b => b.test(s)).length} of ${BADGES.length}</span></div>
    <div class="badges">${BADGES.map(b => { const on = b.test(s); return `<div class="badge ${on ? "" : "locked"}">${medalIcon(b)}<div><b>${b.name}</b><span>${b.desc}</span></div></div>`; }).join("")}</div></section>`;
}

function tripCard(n) {
  const pos = journeyPos(n), next = STOPS.find(t => t.day > n);
  const where = !next ? "You made it to Jerusalem for the Passover!" : pos.t === 0 ? `You're in ${STOPS[pos.k].place}` : `On the road from ${STOPS[pos.k].place} to ${STOPS[pos.k + 1].place}`;
  return `<section class="card trip"><button class="trip-map" data-tab="journey" aria-label="Open the journey map">${mapSVG({ mini: true })}</button>
    <div class="stack" style="gap:6px"><p class="eyebrow">Journey to the Passover</p><h3>${esc(where)}</h3>
    <p class="small muted">${next ? `${plural(next.day - n, "day")} to ${esc(next.place)} · ${plural(DAYS - n, "day")} to the Passover in Jerusalem` : "You walked the whole road with Jesus, from Bethlehem to Jerusalem."}</p>
    <div><button class="btn sm" data-tab="journey">${icon("journey")} Open map</button></div></div></section>`;
}

function viewPlan() {
  const s = stats(state.me), pd = planDay(), start = parseISO(state.config.start);
  const sel = state.sel ? PLAN[state.sel - 1] : null;
  let detail = "";
  if (sel) {
    const isDone = s.doneSet.has(sel.day);
    const date = start ? fmtDate(dayDate(start, sel.day)) : "";
    detail = `<section class="card stack" id="daydetail"><div class="row between"><div class="stack" style="gap:4px">
        <p class="eyebrow">Day ${sel.day}${date ? " · " + date : ""}${isDone ? " · read " + fmtDate(parseISO(state.me.done[sel.day])) : ""}</p>
        <h2>${esc(sel.label)}</h2></div><span class="chip sec sec-${sel.sec}">${SECTIONS[sel.sec]}</span></div>
      <div class="row">
      <button class="btn ${isDone ? "done-state" : "go"}" data-toggle="${sel.day}" ${state.readOnly ? "disabled" : ""}>${isDone ? `${icon("check")} Read · tap to undo` : `${icon("check")} I read this`}</button>
      <a class="btn" href="${readingURL(sel.label, state.config.version)}" target="_blank" rel="noopener">Open Bible ${icon("ext")}</a>
      <button class="btn sm" data-sel="">Close</button></div></section>`;
  }
  let weeks = "";
  for (let w = 0; w < 10; w++) {
    const v = VICTORIES[w];
    weeks += `<div class="week"><div class="week-head"><h3>Week ${w + 1}</h3><span class="small muted">Victory: ${esc(v.title)}</span></div><div class="days">`;
    for (let i = 1; i <= 7; i++) {
      const p = PLAN[w * 7 + i - 1], done = s.doneSet.has(p.day);
      weeks += `<button class="tile sec-${p.sec} ${done ? "done" : ""} ${pd === p.day ? "today" : ""} ${state.sel === p.day ? "sel" : ""} ${p.day % 7 === 0 ? "vic" : ""}"
        data-sel="${p.day}" aria-label="Day ${p.day}: ${esc(p.label)}${done ? ", read" : ""}">${done ? `<span class="ck">${icon("check")}</span>` : ""}<span class="n">${p.day}</span><span class="r">${esc(p.short)}</span></button>`;
    }
    weeks += `</div></div>`;
  }
  return `${detail}<section class="card stack">
    <div class="row between"><h2>The 70-day map</h2><span class="small muted">${s.n}/70 days · about 4 chapters a day</span></div>
    <div class="legend">${Object.entries(SECTIONS).map(([k, l]) => `<span class="chip sec sec-${k}">${l}</span>`).join("")}</div>
    <p class="small muted">Tap any day to open its reading or check it off. The gold ring is today; a gold dot marks a Victory Moment.</p>
    <div>${weeks}</div></section>`;
}

function viewGroup() {
  const list = allPlayers().sort((a, b) => b.s.n - a.s.n || b.s.streak - a.s.streak || a.alias.localeCompare(b.alias));
  const teams = state.config.teams;
  const teamHTML = `<section class="card stack"><h2>The four tribes</h2><p class="small muted">Everyone is placed into a tribe when they join. Tribes are ranked by average progress, so a smaller tribe can still win.</p><div class="teams">${
    teams.map((t, i) => {
      const mem = list.filter(p => teamIndex(p) === i), ch = mem.reduce((a, p) => a + p.s.chapters, 0);
      return { t, i, mem, ch, avg: mem.length ? ch / mem.length / TOTAL * 100 : 0 };
    }).sort((a, b) => b.avg - a.avg).map((x, rank) => `<div class="team" style="--tc:${TEAM_COLORS[x.i]}">
      <h3>${crest(x.i)}<span>${esc(x.t)}</span>${rank === 0 && x.avg > 0 ? ' <span class="rank1">Leading</span>' : ""}</h3>

/* ---------- render ---------- */
const prevVals = {};
function animateValues() {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll("[data-count]").forEach(el => {
    const k = el.dataset.k, to = +el.dataset.count, from = prevVals[k] ?? 0; prevVals[k] = to;
    if (reduce || from === to) return;
    const t0 = performance.now(), dur = 800;
    const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  document.querySelectorAll(".meter i[data-w]").forEach(el => {
    const k = el.dataset.k, to = +el.dataset.w, from = prevVals[k] ?? 0; prevVals[k] = to;
    if (reduce || from === to) return;
    el.style.transition = "none"; el.style.width = from + "%"; void el.offsetWidth;
    el.style.transition = ""; el.style.width = to + "%";
  });
}
function render(force) {

  if (!force && ae && main.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) { state.renderPending = true; return; }

  if (state.phase === "join") { main.innerHTML = viewEditor(true); return; }
  if (state.tab === "me" && !state.draft && state.me) state.draft = draftFrom(state.me);

function confetti(x, y, count = 36) {

  const cols = ["#F2D58C", "#D9AE55", "#E0913A", "#FFF1C9", "#F6B860"];
  for (let i = 0; i < count; i++) {
    const b = document.createElement("div"); b.className = "confetti";
    const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.1, sp = 90 + Math.random() * 160;
    b.style.cssText = `left:${x}px;top:${y}px;background:${cols[i % cols.length]};color:${cols[i % cols.length]};--dx:${Math.cos(a) * sp}px;--dy:${Math.sin(a) * sp + 160 + Math.random() * 120}px;--r:${(Math.random() - 0.5) * 900}deg;animation-delay:${Math.random() * 0.08}s`;
    document.body.appendChild(b); setTimeout(() => b.remove(), 1700);

const revealQueue = [];

  if (done[day]) delete done[day]; else done[day] = todayISO();
  state.me = { ...state.me, done };
  const after = stats(state.me);
  if (after.n > before.n) {
    state.cheerUntil = Date.now() + 2000;
    setTimeout(() => document.querySelectorAll(".av.cheer").forEach(a => a.classList.remove("cheer")), 2000);
    toast(`Day ${day} done · +${PLAN[day - 1].count} chapters`);
    if (el) { const r = el.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2); }
    STOPS.forEach((t, i) => { if (t.day > 0 && t.day === after.n) queueReveal({ kicker: i === STOPS.length - 1 ? "You made it to the Passover" : "New stop on your journey", title: t.place, text: t.title + ". " + t.verseRef + ".",
      art: `<svg class="medal" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4C20 4 11 13 11 25c0 16 21 35 21 35s21-19 21-35C53 13 44 4 32 4z" fill="var(--flame)"/><circle cx="32" cy="25" r="9" fill="#fff"/></svg>`,
      action: "Open the map", onAct: () => { state.stop = i; setTab("journey"); } }); });
    const vic = VICTORIES.find(v => v.day === after.n);
    if (vic) queueReveal({ kicker: "Victory Moment unlocked", title: vic.title, text: `${vic.ref} is ready for you. A story of God bringing his people through.`, art: victoryMedal(VICTORIES.indexOf(vic)), action: "Read the story", onAct: () => setTab("victories") });
    BADGES.filter(b => b.test(after) && !b.test(before)).forEach(b => queueReveal({ kicker: "Badge earned", title: b.name, text: b.desc + ".", art: medalIcon(b) }));
    for (const [k, arr] of Object.entries(UNLOCK)) arr.forEach(([label, , need, who], i) => {
      if (need === after.n && need > before.n && (!who || who === normLook(state.me.look, 0).g)) {
        const look = { ...normLook(state.me.look, after.n), [k]: i };
        queueReveal({ kicker: `New ${UNLOCK_NAMES[k]} unlocked`, title: label, text: `You read ${plural(after.n, "day")}. Try it on!`, art: `<div class="frame mid">${avatarSVG(look, after.n, { portrait: true, live: true })}<div class="frame-fig">${avatarSVG(look, after.n, { live: true })}</div></div>`, action: "Wear it",
          onAct: () => { state.me = { ...state.me, look }; saveMe(); toast(`Wearing ${label}`); render(true); } });
      }
    });
  }
  saveMe(); render(true);
}

function tribeReveal(i, alias) {
  return { kicker: alias ? `Welcome, ${alias}` : "Your tribe", title: state.config.teams[i], text: `"${TEAM_VERSES[i][0]}" (${TEAM_VERSES[i][1]}). Read with your tribe and climb the leaderboard together.`,
    art: crest(i, "big") };
}
// Give an existing player without a valid tribe one, once per visit.
function ensureTeam() {
  if (!state.me || state.readOnly || state.teamChecked || savePending()) return;
  state.teamChecked = true;
  if (teamIndex(state.me) >= 0) { if (!/^[0-3]$/.test(state.me.team)) { state.me = { ...state.me, team: String(teamIndex(state.me)) }; saveMe(); } return; }
  const ti = pickTeam(state.me.id);
  state.me = { ...state.me, team: String(ti) }; saveMe();
  queueReveal(tribeReveal(ti, state.me.alias));
}
async function moveTeam(id, i) {
  try {
    await state.db.doc("players/" + id).update({ team: String(i) });
    if (state.me && id === state.me.id) state.me = { ...state.me, team: String(i) };
    toast(`Moved to ${state.config.teams[i]}`);
  } catch (e) { toast(e && (e.code === "permission-denied" || e.code === "invalid_argument") ? "Only leaders can move players. Publish the latest security rules (SETUP.md step 5)." : "Couldn't move that player"); }
  render(true);
}

async function joinOrSave() {
  const d = state.draft, nm = d && draftName(d); if (!nm) return;
  const alias = (nm + (d.place ? " " + d.place : "")).trim();
  if (takenAliases().has(alias.toLowerCase())) return;
  const base = state.me || { id: state.uid || "local", done: {}, createdAt: new Date().toISOString() };
  const n = stats({ done: base.done || {} }).n;
  const joining = state.phase === "join", ti = teamIndex(base) >= 0 ? teamIndex(base) : pickTeam(base.id);
  state.me = { ...base, alias, gender: d.gender, team: String(ti), look: normLook({ ...d.look, g: d.gender }, n) };
  if (joining) { state.phase = "ready"; state.tab = "today"; state.enter = true; state.cheerUntil = Date.now() + 2000; }
  saveMe(); render(true);
  if (joining) { confetti(innerWidth / 2, innerHeight / 3, 50); queueReveal(tribeReveal(ti, alias)); }
  else toast("Character saved");
}

async function saveConfig(e) {
  e.preventDefault();
  const cfg = normConfig({
    groupName: $("#cfg-name").value, start: $("#cfg-start").value, version: "KJV",
    teams: [0, 1, 2, 3].map(i => $("#cfg-team" + i).value)
  });
  const msg = $("#leadmsg");
  if (state.mode === "local") { state.config = cfg; lsSet("nt70.config", cfg); document.activeElement.blur(); render(true); toast("Settings saved"); return; }
  try { msg.textContent = "Saving…"; await state.db.doc("config/plan").set(cfg); state.config = cfg; document.activeElement.blur(); render(true); toast("Settings saved for the group"); }
  catch (err) { msg.textContent = err && (err.code === "invalid_argument" || err.code === "permission-denied") ? "Only leaders can change these settings." : "Couldn't save. Try again in a moment."; }
}

async function removePlayer(id) {
  try { await state.db.doc("players/" + id).delete(); delete state.players[id]; state.confirmRemove = null; render(true); toast("Player removed"); }
  catch { toast("Couldn't remove that player"); }
}

function selectStop(i) {
  state.stop = i; render(true);
  const c = $("#stopcard"); if (c && innerWidth <= 720) c.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
document.addEventListener("keydown", e => { const st = e.target.closest && e.target.closest("g[data-stop]"); if (st && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); selectStop(+st.dataset.stop); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#reveal").hidden) closeReveal(false); });
document.addEventListener("click", e => {
  const st = e.target.closest("[data-stop]");
  if (st && !e.target.closest(".trip-map")) { selectStop(+st.dataset.stop); return; }
  const t = e.target.closest("button, a"); if (!t) return;
  const ds = t.dataset;
  if (ds.auth) { authAction(ds.auth); return; }
  if (ds.reveal) { closeReveal(ds.reveal === "act"); return; }
  if (ds.stopnav) { const cur = state.stop ?? Math.max(0, STOPS.findIndex(x => x.day > stats(state.me).n) - 1); selectStop(Math.max(0, Math.min(STOPS.length - 1, (cur < 0 ? STOPS.length - 1 : cur) + +ds.stopnav))); return; }
  if (ds.tab) { e.preventDefault(); setTab(ds.tab); return; }
  if (ds.toggle) { toggleDay(+ds.toggle, t); return; }
  if ("sel" in ds) { state.sel = ds.sel ? +ds.sel : null; render(true); if (state.sel) { const d = $("#daydetail"); if (d) d.scrollIntoView({ block: "nearest", behavior: "smooth" }); } return; }
  if (ds.askremove) { state.confirmRemove = ds.askremove; render(true); return; }
  if (ds.remove) { removePlayer(ds.remove); return; }
  const d = state.draft;
  if (!d) return;
  if (ds.gender) {
    if (d.gender !== ds.gender) {
      const fresh = newDraftFor(ds.gender).look;
      ["cover", "mantle", "tunic", "jewel", "beard"].concat(state.phase === "join" ? ["hair", "face", "eyes", "brows"] : []).forEach(k => { d.look[k] = fresh[k]; });
    }
    d.gender = ds.gender; d.name = ""; d.look.g = ds.gender;
  }
  else if (ds.name) d.name = ds.name;
  else if (ds.namemode) d.nameMode = ds.namemode;
  else if (ds.look) {
    if (t.getAttribute("aria-disabled") === "true") { const need = (UNLOCK[ds.look] || [])[+ds.val]?.[2] ?? 0; toast(`Read ${need} days to unlock this`); return; }
    d.look[ds.look] = +ds.val;
  } else if (ds.random) {
    const taken = takenAliases(), names = d.gender === "f" ? NAMES_F : NAMES_M;
    for (let i = 0; i < 60; i++) {
      const nm = names[Math.floor(Math.random() * names.length)], pl = Math.random() < 0.6 ? PLACES[1 + Math.floor(Math.random() * (PLACES.length - 1))] : "";
      if (!taken.has((nm + (pl ? " " + pl : "")).toLowerCase())) { d.name = nm; d.place = pl; break; }
    }
  } else if (ds.save) { joinOrSave(); return; }
  else return;
  render(true);
});
document.addEventListener("change", e => {
  if (e.target.matches && e.target.matches("select[data-move]")) { moveTeam(e.target.dataset.move, +e.target.value); return; }
  if (e.target.id === "place" && state.draft) { state.draft.place = e.target.value; e.target.blur(); render(true); }
});
document.addEventListener("submit", e => { if (e.target.id === "leadform") saveConfig(e); else if (e.target.id === "emailform" || e.target.id === "emailfinish") emailSubmit(e); });
document.addEventListener("input", e => {
  if (e.target.id === "own-name" && state.draft) {
    const d = state.draft; d.ownName = e.target.value;
    const nm = draftName(d), alias = (nm + (nm && d.place ? " " + d.place : "")).trim(), taken = !!nm && takenAliases().has(alias.toLowerCase());
    $("#alias-preview").textContent = alias || "Choose a name";
    $("#alias-taken").hidden = !taken;
    $("#save-btn").disabled = !nm || taken || state.readOnly;
    return;
  } if (e.target.id === "cfg-start") { const h = $("#starthint"); if (h) h.textContent = startHint(e.target.value); } });


/* ---------- boot ---------- */
function startLocal() {
  state.mode = "local"; state.canLead = true;
  state.config = normConfig(lsGet("nt70.config") || DEFAULT_CONFIG);
  const me = normPlayer(lsGet("nt70.me"), "local");
  state.me = me; state.playersLoaded = true;
  state.phase = me ? "ready" : "join";
  if (!me) state.draft = newDraft();
  const h = (location.hash || "").slice(1); if (me && h) state.tab = TABS.some(([k]) => k === h) ? h : "today";
  render(true);
  if (me) ensureTeam();
}

/* ---------- Firebase web app (Google + email-link sign-in) ---------- */
let fb = null;
const GOOGLE_G = `<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>`;
const loadScript = src => new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load " + src)); document.head.appendChild(s); });
function authMsg(e) {
  const c = (e && e.code) || "";
  if (c === "auth/invalid-email") return "That email address doesn't look right.";
  if (c === "auth/invalid-action-code" || c === "auth/expired-action-code") return "That sign-in link has expired or was already used. Request a new one.";
  if (c === "auth/unauthorized-domain") return "This web address isn't approved for sign-in yet. Your leader needs to add it in Firebase (see SETUP.md).";
  if (c === "auth/operation-not-allowed") return "This sign-in method isn't turned on yet. Your leader needs to enable it in Firebase.";
  if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment" || c === "auth/web-storage-unsupported") return POPUP_HELP;
  if (c === "auth/network-request-failed") return "No connection. Check your internet and try again.";
  return "Sign-in didn't work. Please try again.";
}
const POPUP_HELP = "Google sign-in can't open in this browser. If you tapped the link inside another app (Messages, Instagram, Gmail, Claude…), open it in Safari or Chrome instead, or use the email link below.";
// Built-in browsers inside other apps block the Google sign-in window.
const IN_APP_BROWSER = /FBAN|FBAV|Instagram|Line\/|Snapchat|TikTok|musical_ly|GSA\/|Twitter|LinkedInApp|; wv\)/i.test(navigator.userAgent || "");
const ON_FIREBASE_HOST = /\.(web\.app|firebaseapp\.com)$/.test(location.hostname);
const cleanUrl = () => { try { history.replaceState(null, "", location.pathname); } catch {} };

async function startFirebase(cfg) {
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  await loadScript(base + "firebase-app-compat.js");
  await Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-firestore-compat.js")]);
  // On Firebase Hosting the page and the sign-in handler share one domain, so redirect sign-in works everywhere.
  firebase.initializeApp(ON_FIREBASE_HOST ? { ...cfg, authDomain: location.hostname } : cfg);
  const auth = firebase.auth(), fs = firebase.firestore();
  fs.doc("config/plan").get().then(d => { if (d.exists && !state.uid) { state.config = normConfig(d.data()); if (state.phase === "signin") render(true); } }).catch(() => {});
  if (ON_FIREBASE_HOST) auth.getRedirectResult().catch(e => { state.auth.error = authMsg(e); render(true); });
  fb = { auth, fs };
  state.backend = "firebase";
  if (auth.isSignInWithEmailLink(location.href)) {
    const email = lsGet("nt70.email");
    if (email) { try { await auth.signInWithEmailLink(email, location.href); } catch (e) { state.auth.error = authMsg(e); } cleanUrl(); }
    else state.auth.finishEmail = true;
  }
  auth.onAuthStateChanged(async u => {
    if (!u) { if (state.uid) { location.reload(); return; } state.phase = "signin"; render(true); return; }
    if (state.uid) return;
    state.account = { email: u.email || "", uid: u.uid };
    const admin = await fs.doc("admins/" + u.uid).get().then(d => d.exists).catch(() => false);
    startShared(fs, u.uid, { canLead: admin, isOwner: admin, readOnly: false });
  });
}

function viewSignIn() {
  const a = state.auth;
  let body;
  if (a.finishEmail) body = `<form id="emailfinish" class="stack"><label for="fin-email" class="small">Confirm the email address you used</label>
      <input type="email" id="fin-email" required autocomplete="email" placeholder="you@example.com"><button class="btn go" type="submit">Finish signing in</button></form>`;
  else if (a.sent) body = `<div class="note">We sent a sign-in link to <b>${esc(a.sent)}</b>. Open it on this phone or computer to finish. Check your spam folder if it doesn't show up.</div>
      <div><button class="btn sm" data-auth="reset">Use a different email</button></div>`;
  else body = `${IN_APP_BROWSER && !ON_FIREBASE_HOST ? `<div class="note small">You're in another app's built-in browser, where Google sign-in may not open. Use your browser's menu to <b>Open in Safari</b> or <b>Open in Chrome</b>, or sign in with an email link below.</div>` : ""}
      <button class="btn google big" data-auth="google" ${a.busy ? "disabled" : ""}>${GOOGLE_G} Continue with Google</button>
      <div class="or"><span>or get a link by email</span></div>
      <form id="emailform" class="row" style="flex-wrap:nowrap"><input type="email" id="si-email" required autocomplete="email" placeholder="you@example.com" aria-label="Email address" style="flex:1;min-width:0">
      <button class="btn dark" type="submit" ${a.busy ? "disabled" : ""}>Send link</button></form>`;
  const st = parseISO(state.config.start), pd = planDay();
  const dates = st ? `${fmtDate(st)} – ${fmtDate(dayDate(st, DAYS))}` : "70 days";
  const when = pd === null ? "" : pd < 1 ? (pd === 0 ? "Starts tomorrow" : `Starts in ${plural(1 - pd, "day")}`) : pd <= DAYS ? `Day ${pd} of 70 is today. It's not too late to join` : "";
  const feats = [["me", "Create your character", "First-century robes, veils and mantles. Unlock new gear as you read."],
    ["journey", "Walk to Jerusalem", "Every day you read moves you along Jesus' road to the Passover."],
    ["lion", "Join a tribe", "You're placed in one of four tribes competing on one leaderboard."],
    ["victories", "Weekly Victory Moments", "Stories of God's people overcoming, with a question to talk through."]];
  return `<section class="welcome">
    <div class="w-hero">
      <p class="eyebrow">${esc(state.config.groupName)} · ${esc(dates)}</p>
      <h1 class="w-title">Seventy days.<br>One story.<br><em>Your quest.</em></h1>
      <p class="w-sub">Read the whole New Testament together, about four chapters a day. Build your character, join a tribe, and walk the road from Bethlehem to Jerusalem.</p>
      ${when ? `<p class="w-when">${icon("today")}<span>${esc(when)}</span></p>` : ""}
    </div>
    <div class="cast" aria-hidden="true">${SIGNIN_CAST.map((lk, i) => `<div class="frame${i === 2 ? " lead" : ""}" style="--i:${i}">${avatarSVG(lk, 70, { portrait: true, live: true })}</div>`).join("")}</div>
    <div class="card w-card">
      <h2>Start your quest</h2>
      <p class="muted small">Sign in so your character and progress follow you on any phone or computer.</p>
      ${body}${a.error ? `<p class="small" style="color:var(--rose)">${esc(a.error)}</p>` : ""}
      <p class="w-trust">${icon("check")} Free, no ads ${icon("check")} The group only sees your character's name</p>
    </div>
    <ul class="w-feats">${feats.map(([ic, t, d]) => `<li><span class="w-ic">${icon(ic)}</span><b>${t}</b><span>${d}</span></li>`).join("")}</ul>
  </section>`;
}
const SIGNIN_CAST = [
  { g: "m", skin: 3, hair: 3, hairColor: 0, beard: 3, tunic: 1, mantle: 0, cover: 0, face: 2, eyes: 2, brows: 2, mouth: 1 },
  { g: "f", skin: 1, hair: 1, hairColor: 2, tunic: 5, mantle: 0, cover: 1, face: 1, eyes: 0, brows: 0, mouth: 0, jewel: 1 },
  { g: "m", skin: 2, hair: 0, hairColor: 1, beard: 4, tunic: 0, mantle: 4, cover: 1, face: 4, eyes: 3, brows: 1, mouth: 3, hat: 0 },
  { g: "f", skin: 4, hair: 4, hairColor: 0, tunic: 4, mantle: 1, cover: 2, face: 3, eyes: 4, brows: 3, mouth: 1, jewel: 2 },
  { g: "m", skin: 1, hair: 5, hairColor: 3, beard: 2, tunic: 2, mantle: 1, cover: 2, face: 0, eyes: 0, brows: 0, mouth: 0 }
];

async function authAction(kind) {
  const a = state.auth;
  if (kind === "reset") { state.auth = {}; render(true); return; }
  if (kind === "signout") { try { await fb.auth.signOut(); } catch {} location.reload(); return; }
  if (kind === "google") {
    const provider = new firebase.auth.GoogleAuthProvider();
    a.error = ""; a.busy = true; render(true);
    try { await fb.auth.signInWithPopup(provider); }
    catch (e) {
      // No redirect fallback: browsers that partition storage (iPhone Safari, in-app browsers) break redirect sign-in across domains.
      if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/web-storage-unsupported", "auth/internal-error"].includes(e.code)) {
        if (ON_FIREBASE_HOST) { try { await fb.auth.signInWithRedirect(provider); return; } catch (e2) { a.error = authMsg(e2); } }
        else a.error = POPUP_HELP;
      }
      else if (e.code !== "auth/popup-closed-by-user") a.error = authMsg(e);
    }
    a.busy = false; if (state.phase === "signin") render(true);
  }
}
async function emailSubmit(e) {
  e.preventDefault();
  const a = state.auth;
  if (e.target.id === "emailform") {
    const email = $("#si-email").value.trim(); if (!email) return;
    a.busy = true; a.error = ""; render(true);
    try { await fb.auth.sendSignInLinkToEmail(email, { url: location.origin + location.pathname, handleCodeInApp: true }); lsSet("nt70.email", email); a.sent = email; }
    catch (err) { a.error = authMsg(err); }
    a.busy = false; render(true);
  } else if (e.target.id === "emailfinish") {
    const email = $("#fin-email").value.trim();
    try { await fb.auth.signInWithEmailLink(email, location.href); a.finishEmail = false; cleanUrl(); }
    catch (err) { a.error = authMsg(err); render(true); }
  }
}

function startShared(db, uid, perms) {
  state.mode = "shared"; state.db = db; state.uid = uid;
  state.canLead = perms.canLead; state.isOwner = perms.isOwner; state.readOnly = perms.readOnly;
  state.phase = "loading"; render(true);
  const h = (location.hash || "").slice(1); if (h) state.tab = TABS.some(([k]) => k === h) ? h : "today";

  db.doc("config/plan").onSnapshot(snap => {
    state.config = normConfig(snap.exists ? snap.data() : DEFAULT_CONFIG);
    if (state.phase !== "loading") render();
  }, () => {});

  db.collection("players").onSnapshot(snap => {
    const players = {};
    snap.docs.forEach(d => { const p = normPlayer(d.data(), d.id); if (p) players[d.id] = p; });
    state.players = players;
    const mine = players[uid];
    if (mine && !savePending()) state.me = mine;
    if (!state.playersLoaded && !snap.metadata.fromCache) {
      state.playersLoaded = true;
      if (state.me) state.phase = "ready";
      else { state.phase = "join"; state.draft = newDraft(); }
    } else if ((state.phase === "loading" || state.phase === "join") && mine) { state.me = mine; state.phase = "ready"; }
    if (state.phase === "ready" && state.tab === "me" && !state.draft) state.draft = draftFrom(state.me);
    render();
    if (state.phase === "ready" && state.playersLoaded) ensureTeam();
  }, () => {
    if (state.phase === "loading") { startLocal(); toast("Couldn't reach the group. Playing solo for now."); }
  });

  setTimeout(() => { if (state.phase === "loading" && !state.playersLoaded) { state.playersLoaded = true; state.phase = state.me ? "ready" : "join"; if (!state.me) state.draft = newDraft(); render(true); } }, 8000);
}

async function boot() {
  render(true);
  const c = window.claude;
  if (c && typeof c.use === "function") {
    let db = null, user = null;
    try { [db, user] = await Promise.all([c.use("db"), c.use("user")]); } catch {}
    const uid = user ? await user.id().catch(() => null) : null;
    if (!db || !uid) { startLocal(); return; }
    state.backend = "claude";
    const [canEdit, isOwner, canWrite] = await Promise.all([user.canEdit().catch(() => false), user.isOwner().catch(() => false), user.can("data.write").catch(() => null)]);
    startShared(db, uid, { canLead: canEdit || isOwner, isOwner, readOnly: canWrite === false });
    return;
  }
  const cfg = window.NT70_FIREBASE;
  if (cfg && cfg.apiKey && !/^PASTE/.test(cfg.apiKey)) {
    try { await startFirebase(cfg); } catch { startLocal(); toast("Couldn't connect to sign-in. Playing solo for now."); }
    return;
  }
  startLocal();
}
boot();
})();
</script>
