<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F0562A"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="NT70 Quest"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="firebase-config.js"></script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>NT70 Reading Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: game quest-log shell. Dark lamplit ground, leather-dark panels with bronze hairlines, Roman-inscription serif titles, parchment text, gold for progress. Single deliberate dark theme. */
:root {
  --bg: #0E0B09;
  --surface: #1A1512;
  --surface-2: #241D18;
  --ink: #ECE1CA;
  --muted: #A8977C;
  --line: #3E3227;
  --bronze: #8C6A3E;
  --flame: #C8572F;
  --flame-2: #E0913A;
  --gold: #D9AE55;
  --gold-hi: #F2D58C;
  --teal: #8DA35E;
  --violet: #9A6AAE;
  --rose: #C2533F;
  --sky: #8FA8DC;
  --on: #1A120B;
  --gold-ink: #22170A;
  --sec-g: #8DA35E; --sec-a: #C8692F; --sec-p: #D3A24A; --sec-l: #7F8BD0; --sec-r: #B9493D;
  --shadow: 0 1px 0 rgba(255,230,190,.04) inset, 0 18px 40px -18px rgba(0,0,0,.9);
  --shadow-lg: 0 30px 80px -20px rgba(0,0,0,.95);
  --radius: 10px;
  --sea: #7E9C98; --sea-ink: #3F5F5C; --land: #D8C399; --land-2: #C6AC78; --hill: #AF9060; --hill-2: #937549; --tree: #6E7F42; --map-ink: #4A3721;
  --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --font-body: "Alegreya Sans", "Gill Sans", system-ui, sans-serif;
  --step--1: 0.85rem; --step-0: 1.0625rem; --step-1: 1.3rem; --step-2: 1.7rem; --step-3: 2.5rem;
  --ease: cubic-bezier(.2,.8,.2,1);
  --spring: cubic-bezier(.34,1.4,.64,1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: radial-gradient(120% 60% at 50% -10%, #3A2716 0%, rgba(58,39,22,0) 60%), radial-gradient(80% 50% at 100% 100%, #1E1410 0%, rgba(30,20,16,0) 70%), var(--bg); background-attachment: fixed; color: var(--ink); font-family: var(--font-body); font-size: var(--step-0); line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #120E0B; }
h1, h2, h3, .disp { font-family: var(--font-display); font-weight: 700; letter-spacing: .02em; text-wrap: balance; margin: 0; line-height: 1.15; color: var(--ink); }
h2 { font-size: var(--step-2); }
h3 { font-size: var(--step-1); font-weight: 600; }
p { margin: 0; }
a { color: var(--gold); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: linear-gradient(#17120E, #120E0B); border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 rgba(217,174,85,.08), 0 10px 30px -10px #000; }
.bar { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.brand-mark { width: 40px; height: 40px; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--gold-hi), var(--gold) 45%, #7A5520 100%); color: #2A1A08; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 14px; box-shadow: 0 0 0 2px #2A1F16, 0 0 0 3px var(--bronze), 0 6px 18px -6px rgba(217,174,85,.6); }
.brand h1 { font-size: var(--step-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .06em; }
.brand small { display: block; font-family: var(--font-body); font-weight: 500; font-size: var(--step--1); color: var(--muted); letter-spacing: .02em; }
.mepill { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 14px 3px 3px; cursor: pointer; min-width: 0; }
.mepill .bubble { width: 36px; height: 36px; }
.mepill span:not(.bubble) { font-family: var(--font-display); font-weight: 600; font-size: var(--step--1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
.tabs { display: flex; gap: 2px; padding-block: 0; }
.tabs button { position: relative; display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; padding: 10px 14px 12px; font-family: var(--font-display); font-weight: 600; font-size: var(--step--1); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; transition: color .2s; }
.tabs button svg { width: 17px; height: 17px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-current="page"] { color: var(--gold); }
.tabs button[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

main { padding-block: 24px 72px; display: grid; gap: 18px; }
main.enter > * { animation: rise .55s var(--ease) both; }
main.enter > *:nth-child(2) { animation-delay: .06s; } main.enter > *:nth-child(3) { animation-delay: .12s; }
main.enter > *:nth-child(4) { animation-delay: .18s; } main.enter > *:nth-child(5) { animation-delay: .24s; } main.enter > *:nth-child(n+6) { animation-delay: .3s; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* Panels */
.card { position: relative; background: linear-gradient(180deg, #211A15, #18130F); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; min-width: 0; }
.card::before { content: ""; position: absolute; inset: 4px; border: 1px solid rgba(217,174,85,.07); border-radius: 7px; pointer-events: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }
.eyebrow { font-family: var(--font-display); font-size: .74rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
.note { border-radius: 8px; padding: 12px 16px; background: rgba(217,174,85,.08); border: 1px solid rgba(217,174,85,.22); color: var(--ink); }
.note.warn { background: rgba(194,83,63,.12); border-color: rgba(194,83,63,.4); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); border-radius: 6px; background: linear-gradient(#2B231C, #211A15); padding: 10px 18px; font-family: var(--font-display); font-weight: 600; font-size: var(--step--1); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; text-decoration: none; color: var(--ink); transition: transform .15s var(--spring), filter .2s, box-shadow .2s; box-shadow: 0 1px 0 rgba(255,230,190,.06) inset; }
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: scale(.97); }
.btn svg { width: 17px; height: 17px; }
.btn.go { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, #A57A2E); color: var(--gold-ink); border-color: #6E4F1E; box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 -2px 0 rgba(0,0,0,.2) inset, 0 10px 26px -12px rgba(217,174,85,.8); text-shadow: 0 1px 0 rgba(255,240,200,.4); }
.btn.dark { background: linear-gradient(#ECE1CA, #CDBF9F); color: #23190E; border-color: #8C7A58; }
.btn.big { font-size: var(--step-0); padding: 14px 24px; }
.btn.sm { padding: 7px 12px; font-size: .72rem; }
.btn.danger { background: linear-gradient(#B04A39, #8A3326); color: #fff; border-color: #5E2219; }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; filter: none; }
.btn.done-state { background: rgba(141,163,94,.14); color: var(--teal); border-color: rgba(141,163,94,.4); }

.chip { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; padding: 3px 9px; font-size: .78rem; font-weight: 700; letter-spacing: .03em; background: var(--surface-2); border: 1px solid var(--line); }
.chip svg { width: 14px; height: 14px; flex: none; }
.chip.sec { background: color-mix(in srgb, var(--sc) 14%, transparent); color: var(--sc); border-color: color-mix(in srgb, var(--sc) 40%, transparent); }
.chip.ok { background: rgba(141,163,94,.14); color: var(--teal); border-color: rgba(141,163,94,.4); }
.chip.behind { background: rgba(194,83,63,.14); color: #E07E69; border-color: rgba(194,83,63,.4); }
.sec-g { --sc: var(--sec-g); } .sec-a { --sc: var(--sec-a); } .sec-p { --sc: var(--sec-p); } .sec-l { --sc: var(--sec-l); } .sec-r { --sc: var(--sec-r); }

/* Portraits, frames and figures */
.av { display: block; overflow: visible; }
.pt .pt-body { transform-origin: 100px 240px; }
.pt .pt-head { transform-origin: 100px 140px; }
.pt .pt-eyes { transform-origin: 100px 92px; }
.pt.live .pt-body { animation: breathe 4.2s ease-in-out infinite; animation-delay: var(--d, 0s); }
.pt.live .pt-head { animation: sway 7s ease-in-out infinite; animation-delay: var(--d, 0s); }
.pt.live .pt-eyes { animation: blink 5.5s infinite; animation-delay: var(--d, 0s); }
.pt.cheer .pt-head { animation: lift 1.6s var(--ease) 1; }
.fg .fg-body { transform-origin: 30px 78px; }
.fg.live .fg-body { animation: sway-fig 5s ease-in-out infinite; animation-delay: var(--d, 0s); }
.fg.cheer .fg-body { animation: hop .9s var(--ease) 2; }
.av .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .45s ease-in-out infinite alternate; }
@keyframes breathe { 50% { transform: translateY(-1.2px) scaleY(1.006); } }
@keyframes sway { 30% { transform: rotate(-.8deg); } 70% { transform: rotate(.7deg); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
@keyframes lift { 35% { transform: rotate(-2.5deg) translateY(-3px); } }
@keyframes sway-fig { 50% { transform: rotate(1.2deg); } }
@keyframes hop { 40% { transform: translateY(-5px); } }
@keyframes flicker { to { transform: scale(1.15, .88); } }
.bubble { border-radius: 50%; background: radial-gradient(circle at 50% 30%, #4A3420, #1E1712 75%); overflow: hidden; flex: none; display: block; box-shadow: 0 0 0 1px var(--bronze), 0 0 0 3px #1A1410; }
.bubble .av { width: 100%; height: 100%; }
.frame { position: relative; aspect-ratio: 5 / 6; width: 100%; max-width: 100%; border-radius: 8px; overflow: hidden;
  background: radial-gradient(70% 55% at 50% 38%, #6A4527 0%, #3A2617 45%, #160F0B 100%);
  box-shadow: 0 0 0 1px #6E5330, 0 0 0 4px #1A1410, 0 0 0 5px var(--bronze), 0 20px 40px -18px #000; }
.frame::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 40% at 30% 18%, rgba(255,200,120,.22), transparent 70%); pointer-events: none; z-index: 1; }
.frame::after { content: ""; position: absolute; inset: 6px; border: 1px solid rgba(217,174,85,.25); border-radius: 4px; pointer-events: none; z-index: 2; }
.frame > .pt { position: absolute; inset: 0; width: 100%; height: 100%; }
.frame-fig { position: absolute; right: 8px; bottom: 6px; width: 22%; aspect-ratio: 3 / 4; z-index: 3; filter: drop-shadow(0 2px 4px rgba(0,0,0,.7)); }
.frame-fig .av { width: 100%; height: 100%; }
.frame.glow { box-shadow: 0 0 0 1px #6E5330, 0 0 0 4px #1A1410, 0 0 0 5px var(--gold), 0 0 50px -6px rgba(242,213,140,.7); transition: box-shadow .6s; }

/* Today */
.hero { display: grid; grid-template-columns: 230px 1fr; gap: 28px; align-items: center; }
.hero-day { font-size: var(--step-3); color: var(--gold-hi); text-shadow: 0 2px 18px rgba(217,174,85,.25); }
.hero-read { font-size: var(--step-2); font-family: var(--font-display); font-weight: 500; line-height: 1.15; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { background: linear-gradient(180deg, #211A15, #18130F); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: var(--step-2); font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums lining-nums; color: var(--gold-hi); }
.stat b small { font-size: var(--step-0); color: var(--muted); font-weight: 500; }
.stat .sl { font-size: var(--step--1); color: var(--muted); }
.stat .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 6px; border: 1px solid currentColor; }
.stat .ic svg { width: 15px; height: 15px; }
.meter { height: 10px; border-radius: 999px; background: #0E0B09; border: 1px solid var(--line); position: relative; overflow: hidden; box-shadow: 0 1px 2px #000 inset; }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: linear-gradient(90deg, #8A5A22, var(--gold), var(--gold-hi)); box-shadow: 0 0 12px rgba(242,213,140,.5); transition: width 1.1s var(--ease); }
.meter i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); transform: translateX(-100%); animation: shine 3s ease-in-out infinite 1s; }
@keyframes shine { 60%, 100% { transform: translateX(100%); } }
.catch { display: flex; flex-wrap: wrap; gap: 8px; }
.chip.soft { background: rgba(217,174,85,.12); color: var(--gold-hi); border-color: rgba(217,174,85,.4); }
.linkish { justify-self: start; background: none; border: 0; padding: 4px 0; color: var(--gold); font: 600 var(--step--1) var(--font-body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.linkish.back { text-decoration: none; font-family: var(--font-display); letter-spacing: .06em; }
.prog { display: grid; gap: 10px; padding: 4px 2px; }
.prog-line { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; color: var(--muted); font-size: var(--step--1); }
.prog-line b { color: var(--gold-hi); font-family: var(--font-display); font-size: var(--step-0); }
.prog-line span { display: inline-flex; align-items: center; gap: 6px; }
.prog-line svg { width: 15px; height: 15px; color: var(--flame-2); }
.catchup { border-color: rgba(217,174,85,.35); }
.thru { display: grid; gap: 6px; padding-top: 4px; }
details.pick summary, details.more summary { cursor: pointer; list-style: none; }
details.pick summary::-webkit-details-marker, details.more summary::-webkit-details-marker { display: none; }
details.pick summary { color: var(--gold); text-decoration: underline; text-underline-offset: 3px; margin-bottom: 8px; }
details.more summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
details.more summary > span { display: grid; gap: 2px; }
details.more summary > svg { width: 22px; height: 22px; color: var(--gold); transition: transform .2s; flex: none; }
details.more[open] summary > svg { transform: rotate(180deg); }
.stat .ic { border: 1px solid currentColor; background: rgba(0,0,0,.2); }
.rv-list { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 8px; width: 100%; text-align: left; }
.rv-list li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: rgba(0,0,0,.25); }
.rv-list li > span:last-child { display: grid; }
.rv-ic { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--gold-hi); border: 1px solid rgba(217,174,85,.45); }
.rv-ic svg { width: 16px; height: 16px; }
.wn-art { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; color: var(--gold-hi); border: 2px solid var(--bronze); background: radial-gradient(circle at 50% 35%, #4A3420, #1E1712 75%); }
.wn-art svg { width: 64px; height: 64px; }
.app-ver { text-align: center; margin-top: 18px; }
.savestat { font-size: .78rem; font-weight: 700; color: var(--teal); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; min-height: 1em; }
.savestat svg { width: 14px; height: 14px; }
.savestat.saving { color: var(--muted); }
.savestat.error { color: #E07E69; cursor: pointer; text-decoration: underline; }
.toast-btn { margin-left: 10px; background: none; border: 1px solid var(--gold); color: var(--gold-hi); border-radius: 4px; padding: 3px 10px; font: 700 .8rem var(--font-body); cursor: pointer; }

/* Badges */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.badge { display: grid; grid-template-columns: 42px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: rgba(0,0,0,.25); border: 1px solid var(--line); }
.badge.locked { opacity: .45; }
.badge.locked .medal-ic { filter: grayscale(1) brightness(.7); }
.medal-ic { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: #2A1A08; background: radial-gradient(circle at 35% 30%, var(--gold-hi), var(--gold) 50%, #7A5520); box-shadow: 0 0 0 2px #1A1410, 0 0 0 3px var(--bc), 0 4px 12px -4px rgba(0,0,0,.8); }
.medal-ic svg { width: 20px; height: 20px; }
.badge b { display: block; font-family: var(--font-display); font-size: .8rem; font-weight: 600; line-height: 1.2; }
.badge > div span { font-size: .78rem; color: var(--muted); line-height: 1.2; display: block; }

/* Plan grid */
.week { display: grid; gap: 8px; }
.week + .week { margin-top: 18px; }
.week-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; align-items: baseline; }
.week-head h3 { font-size: var(--step-0); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.tile { position: relative; border: 1px solid var(--line); border-radius: 6px; background: linear-gradient(#1F1813, #17120E); min-height: 72px; padding: 8px; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; transition: transform .2s var(--spring), background .25s, box-shadow .2s, border-color .2s; box-shadow: inset 0 2px 0 var(--sc); }
.tile:hover { transform: translateY(-2px); border-color: var(--bronze); }
.tile .n { font-family: var(--font-display); font-weight: 700; font-size: var(--step-1); line-height: 1; }
.tile .r { font-size: .72rem; line-height: 1.15; overflow-wrap: anywhere; color: var(--muted); }
.tile .ck { position: absolute; right: 6px; top: 7px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,.25); display: grid; place-items: center; }
.tile .ck svg { width: 12px; height: 12px; }
.tile.done { background: linear-gradient(180deg, color-mix(in srgb, var(--sc) 85%, #fff 15%), var(--sc)); color: #170F08; border-color: color-mix(in srgb, var(--sc) 60%, #000); box-shadow: 0 6px 16px -10px var(--sc); }
.tile.done .r { color: rgba(23,15,8,.75); }
.tile.today { box-shadow: inset 0 2px 0 var(--sc), 0 0 0 2px var(--gold), 0 0 18px -2px rgba(242,213,140,.55); }
.tile.sel { box-shadow: 0 0 0 2px var(--ink); }
.tile.vic::before { content: ""; position: absolute; left: 8px; bottom: 8px; width: 8px; height: 8px; transform: rotate(45deg); background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.tile.done.vic::before { background: #170F08; box-shadow: none; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }

/* Cheers, discussion, recap */
.cheers { display: inline-flex; align-items: center; gap: 4px; }
.cheer { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: rgba(0,0,0,.25); font-size: 16px; line-height: 1; cursor: pointer; transition: transform .15s var(--spring), border-color .2s, background .2s; }
.cheer:active { transform: scale(.88); }
.cheer.on { border-color: var(--gold); background: rgba(217,174,85,.18); box-shadow: 0 0 10px -2px rgba(242,213,140,.6); }
.cheer-count { font-size: .75rem; font-weight: 700; color: var(--gold-hi); }
.cheer-card { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; border-color: rgba(217,174,85,.35); }
.cheer-card p { flex: 1 1 220px; }
.disc { border-top: 1px solid var(--line); padding-top: 10px; }
.disc summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--gold); min-height: 40px; }
.disc summary::-webkit-details-marker { display: none; }
.disc summary svg { width: 18px; height: 18px; }
.replies { list-style: none; margin: 8px 0 12px; padding: 0; display: grid; gap: 10px; }
.replies li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
.replies li > div { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 0; }
.replies b { font-family: var(--font-display); font-size: .85rem; }
.replies p { overflow-wrap: anywhere; margin-top: 2px; }
.bubble.sm-b { width: 34px; height: 34px; }
.reply-form { display: flex; gap: 8px; align-items: flex-end; }
.reply-form textarea { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: #0F0C0A; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; resize: vertical; }
.recap { border-color: rgba(217,174,85,.45); box-shadow: var(--shadow), 0 0 50px -24px rgba(217,174,85,.6); display: grid; gap: 10px; }
.recap-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.recap-list li { position: relative; padding-left: 28px; }
.recap-list svg { position: absolute; left: 0; top: 3px; width: 18px; height: 18px; color: var(--gold); }
.recap .btn { justify-self: start; }
.prow { content-visibility: auto; contain-intrinsic-size: auto 66px; }
.prow-acts { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.prow-acts .cheers { margin-right: auto; }

/* Quiz */
.quiz { display: grid; gap: 14px; max-width: 640px; width: 100%; justify-self: center; }
.qz-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.qz-dots { display: inline-flex; gap: 6px; }
.qz-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.qz-dots i.cur { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.qz-dots i.ok { background: var(--teal); } .qz-dots i.no { background: var(--rose); }
.qz-verse { margin: 0; padding: 14px 16px; border-radius: 8px; background: rgba(0,0,0,.28); border-left: 3px solid var(--gold); font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-size: 1.12rem; line-height: 1.6; }
.qz-blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--gold); color: transparent; }
.qz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qz-opt { min-height: 52px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: linear-gradient(#2B231C, #211A15); color: var(--ink); font: 700 1rem var(--font-body); cursor: pointer; transition: transform .15s var(--spring), border-color .2s, background .2s; }
.qz-opt:hover:not([disabled]) { border-color: var(--gold); }
.qz-opt:active:not([disabled]) { transform: scale(.97); }
.qz-opt.right { border-color: var(--teal); background: rgba(141,163,94,.22); color: #D7E8B8; }
.qz-opt.wrong { border-color: var(--rose); background: rgba(194,83,63,.2); color: #F2B9AC; }
.qz-opt.dim { opacity: .45; }
.qz-fb { padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); display: grid; gap: 6px; }
.qz-fb.ok { border-color: rgba(141,163,94,.5); } .qz-fb.ok b { color: var(--teal); }
.qz-fb.no { border-color: rgba(194,83,63,.5); } .qz-fb.no b { color: #E07E69; }
.qz-end { text-align: center; justify-items: center; }
.qz-score { font-family: var(--font-display); color: var(--gold-hi); display: flex; align-items: baseline; gap: 6px; }
.qz-score b { font-size: 4rem; line-height: 1; }
.qz-score span { font-size: 1.4rem; color: var(--muted); }
.quiz-nudge { border-color: rgba(143,168,220,.35); }
@media (max-width: 420px) { .qz-opts { grid-template-columns: 1fr; } }

/* Reader */
.reader { --rd-ink: #EFE6D2; --rd-bg: linear-gradient(180deg, #1F1915, #17120F); --rd-num: var(--gold); --rd-head: var(--gold-hi); background: var(--rd-bg); padding: 26px clamp(18px, 5vw, 48px) 30px; }
.reader.light { --rd-ink: #2A1E12; --rd-bg: linear-gradient(180deg, #F3EAD6, #E9DCC0); --rd-num: #9A6B1E; --rd-head: #5A3B12; border-color: #B79C6C; }
.reader.light .eyebrow, .reader.light .muted { color: #7A6040; }
.reader.light h2 { color: #3A2810; }
.reader.light .linkish, .reader.light .rd-alt a { color: #7A4E12; }
.rd-head { display: grid; gap: 10px; max-width: 40em; margin: 0 auto 8px; }
.rd-tools { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.rd-jump, .rd-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.rd-jump button, .rd-opts button { min-height: 40px; min-width: 44px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: rgba(0,0,0,.2); color: inherit; font: 700 .85rem var(--font-body); cursor: pointer; }
.reader.light .rd-jump button, .reader.light .rd-opts button { border-color: #B79C6C; background: rgba(255,255,255,.4); color: #3A2810; }
.rd-text { max-width: 40em; margin: 0 auto; color: var(--rd-ink); font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: var(--rd-size); line-height: 1.75; }
.rd-chapter { padding-top: 18px; scroll-margin-top: 130px; }
.rd-chapter h3 { font-family: var(--font-display); color: var(--rd-head); font-size: 1.05em; letter-spacing: .08em; margin-bottom: 8px; }
.rd-chapter p { margin: 0; }
.rd-chapter sup { color: var(--rd-num); font-family: var(--font-body); font-weight: 700; font-size: .62em; margin: 0 .2em 0 .35em; vertical-align: .55em; }
.rd-done { max-width: 40em; margin: 28px auto 0; padding-top: 22px; border-top: 1px solid var(--line); display: grid; gap: 12px; justify-items: center; text-align: center; }
.rd-done .eyebrow { display: inline-flex; align-items: center; gap: 6px; color: var(--teal); }
.rd-done .eyebrow svg { width: 16px; height: 16px; }
.rd-alt { max-width: 40em; margin: 18px auto 0; text-align: center; }
.rd-alt a { display: inline-flex; align-items: center; gap: 6px; }
.rd-alt svg { width: 14px; height: 14px; }
.rd-loading { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; padding: 40px 0; }
.rd-loading span { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); animation: pulse 1.2s ease-in-out infinite; }
.rd-loading span:nth-child(2) { animation-delay: .2s; } .rd-loading span:nth-child(3) { animation-delay: .4s; }
.rd-loading p { width: 100%; text-align: center; }

/* Group */
.teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.team { border-radius: 8px; padding: 14px; background: rgba(0,0,0,.25); border: 1px solid var(--line); display: grid; gap: 8px; }
button.team { font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; transition: border-color .2s, background .2s; }
button.team:hover { border-color: var(--tc); }
.team.open { border-color: var(--tc); background: rgba(0,0,0,.4); box-shadow: inset 0 0 0 1px var(--tc); }
.team .tsee { display: inline-flex; align-items: center; gap: 4px; font-size: var(--step--1); font-weight: 600; color: var(--gold-hi); }
.team .tsee i { font-style: normal; font-size: 1.1em; transition: transform .2s; }
.team.open .tsee i { transform: rotate(90deg); }
.roster { border-radius: 8px; padding: 14px; border: 1px solid var(--tc); border-left-width: 4px; background: rgba(0,0,0,.25); display: grid; gap: 10px; }
.roster h3 { display: flex; align-items: center; gap: 8px; font-size: var(--step-0); }
.roster ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.roster li { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 6px; background: rgba(255,255,255,.03); }
.roster li.me { background: rgba(217,174,85,.08); }
.roster .bubble { width: 40px; height: 40px; }
.roster .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-display); font-weight: 600; }
.roster .who span { font-size: var(--step--1); color: var(--muted); }
.roster .nums { text-align: right; font-variant-numeric: tabular-nums; font-size: var(--step--1); color: var(--muted); display: grid; justify-items: end; gap: 2px; }
.roster .nums b { font-family: var(--font-display); font-size: var(--step-0); color: var(--gold-hi); line-height: 1; }
.team h3 { display: flex; align-items: center; gap: 8px; font-size: var(--step-0); }
.team .meter i { background: var(--tc); box-shadow: none; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
.rank1 { font-family: var(--font-display); font-size: .62rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; background: var(--gold); color: var(--gold-ink); }
.track-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--line); background: linear-gradient(180deg, #2A1D13 0%, #1A1410 70%); scrollbar-width: thin; }
.track { display: grid; grid-template-columns: repeat(71, 34px); align-items: end; width: max-content; padding: 10px 14px 12px; position: relative; }
.track::after { content: ""; position: absolute; left: 31px; right: 31px; bottom: 21px; height: 3px; background: repeating-linear-gradient(90deg, var(--bronze) 0 6px, transparent 6px 10px); z-index: 0; opacity: .7; }
.tcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; position: relative; z-index: 1; }
.tcol .ppl { display: flex; flex-direction: column-reverse; align-items: center; min-height: 52px; }
.tcol .ppl > span + span { margin-bottom: -20px; }
.tcol .av { width: 30px; height: 40px; }
.tcol .more { font-size: .65rem; font-weight: 800; }
.tdot { width: 10px; height: 10px; border-radius: 50%; background: #1A1410; border: 2px solid var(--bronze); }
.tdot.mile { width: 16px; height: 16px; border-radius: 2px; transform: rotate(45deg); background: var(--gold); border-color: #1A1410; box-shadow: 0 0 10px rgba(242,213,140,.6); }
.tdot.go { width: 16px; height: 16px; background: var(--teal); border-color: #1A1410; }
.tdot.me { background: var(--flame-2); border-color: #1A1410; box-shadow: 0 0 0 3px rgba(224,145,58,.4), 0 0 12px var(--flame-2); }
.tlabel { font-size: .62rem; font-weight: 700; color: var(--muted); height: 12px; line-height: 12px; }
.board { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 26px 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; border-radius: 8px; padding: 8px 12px; background: rgba(0,0,0,.22); border: 1px solid var(--line); }
.prow.me { background: rgba(217,174,85,.08); border-color: rgba(217,174,85,.4); }
.prow .rank { font-family: var(--font-display); font-weight: 700; font-size: var(--step-1); text-align: center; font-variant-numeric: tabular-nums lining-nums; color: var(--muted); }
.prow:nth-child(-n+3) .rank { color: var(--gold); }
.prow .bubble { width: 46px; height: 46px; }
.prow .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-display); font-weight: 600; }
.prow .who span { font-size: var(--step--1); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.prow .nums { text-align: right; font-variant-numeric: tabular-nums; font-size: var(--step--1); color: var(--muted); display: grid; justify-items: end; gap: 4px; }
.prow .nums b { font-family: var(--font-display); font-size: var(--step-1); color: var(--gold-hi); line-height: 1; }

/* Victories */
.vics { display: grid; gap: 16px; }
.vic { display: grid; grid-template-columns: 76px 1fr; gap: 20px; }
.vic .medal { width: 76px; height: 76px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
.vic.locked { background: #120E0B; }
.vic.locked .medal { filter: grayscale(1) brightness(.6); }
.vic blockquote, .stop-card blockquote { margin: 0; padding: 14px 18px; border-radius: 6px; background: linear-gradient(180deg, #E9DCC0, #D8C7A2); color: #2A1C0E; font-family: var(--font-display); font-weight: 500; font-size: var(--step-1); line-height: 1.35; box-shadow: 0 0 0 1px #8C7450 inset, 0 10px 20px -12px #000; }
.vic blockquote span, .stop-card blockquote span { display: block; font-family: var(--font-body); font-size: var(--step--1); font-weight: 700; color: #6A5536; margin-top: 6px; letter-spacing: .04em; }
.vic .q { padding: 12px 14px; border-radius: 6px; background: rgba(0,0,0,.25); border: 1px solid var(--line); }
.vic .body { display: grid; gap: 10px; max-width: 68ch; }

/* Editor */
.editor { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 30px; }
.preview { display: grid; justify-items: center; gap: 10px; align-content: start; position: sticky; top: 120px; }
.save-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; padding: 16px; border-radius: 8px; border: 1px solid rgba(217,174,85,.35); background: rgba(217,174,85,.07); }
.save-bar > div { display: grid; gap: 2px; min-width: 0; }
.save-bar b { font-family: var(--font-display); font-size: var(--step-1); color: var(--gold-hi); overflow-wrap: anywhere; }
.preview .alias { font-family: var(--font-display); font-weight: 700; font-size: var(--step-1); text-align: center; color: var(--gold-hi); }
.group { display: grid; gap: 18px; }
.ghead { font-size: .8rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 12px; }
.ghead::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
.field { display: grid; gap: 8px; }
.field > label, .field > .lbl { font-weight: 700; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border: 1px solid var(--line); border-radius: 4px; background: rgba(0,0,0,.25); padding: 6px 11px; cursor: pointer; font-size: .85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; transition: background .2s, color .2s, border-color .2s, transform .15s var(--spring); }
.opt:hover { border-color: var(--bronze); }
.opt:active { transform: scale(.95); }
.opt[aria-pressed="true"] { background: linear-gradient(var(--gold-hi), var(--gold)); color: var(--gold-ink); border-color: #6E4F1E; }
.opt[disabled] { cursor: not-allowed; opacity: .35; text-decoration: line-through; }
.opt.lock { opacity: .55; }
.opt .lk { width: 12px; height: 12px; display: inline-grid; }
.feats { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.feat { border: 1px solid var(--line); border-radius: 6px; background: rgba(0,0,0,.25); padding: 6px 4px; cursor: pointer; display: grid; justify-items: center; gap: 5px; font-size: .78rem; font-weight: 700; transition: transform .15s var(--spring), border-color .2s, box-shadow .2s; }
.feat:hover { border-color: var(--bronze); }
.feat:active { transform: scale(.96); }
.feat[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 16px -4px rgba(242,213,140,.6); color: var(--gold-hi); }
.fprev { width: 72px; height: 40px; border-radius: 4px; overflow: hidden; display: block; background: radial-gradient(80% 80% at 50% 40%, #5A3B22, #1A1310); }
.fprev .av { width: 100%; height: 100%; }
.feat[data-look="face"] .fprev, .feat[data-look="hair"] .fprev, .feat[data-look="cover"] .fprev, .feat[data-look="beard"] .fprev, .feat[data-look="jewel"] .fprev { height: 72px; }
.sw-opt { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #1A1410; box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; position: relative; transition: transform .15s var(--spring), box-shadow .2s; }
.sw-opt:hover { transform: scale(1.08); }
.sw-opt[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--gold), 0 0 12px -2px rgba(242,213,140,.7); }
.sw-opt.lock::after { content: attr(data-day); position: absolute; inset: -2px; border-radius: 50%; background: rgba(10,8,6,.7); color: var(--ink); font-size: .58rem; font-weight: 800; display: grid; place-items: center; }
select, input[type="date"], input[type="text"], input[type="email"], input[type="password"] { font: inherit; color: var(--ink); background: #0F0C0A; border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; max-width: 100%; }
.seg { display: inline-flex; justify-self: start; background: #0F0C0A; border: 1px solid var(--line); border-radius: 6px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 4px; padding: 7px 18px; cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: linear-gradient(#3A2E22, #2A2119); color: var(--gold-hi); box-shadow: 0 0 0 1px var(--bronze); }

/* Toast, sparks, reveal */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: linear-gradient(#2B221A, #1C1612); color: var(--ink); border: 1px solid var(--bronze); border-radius: 6px; padding: 12px 20px; font-family: var(--font-display); font-weight: 600; letter-spacing: .04em; box-shadow: var(--shadow-lg), 0 0 24px -8px rgba(217,174,85,.6); max-width: calc(100vw - 32px); text-align: center; animation: toastin .45s var(--spring); }
@keyframes toastin { from { transform: translate(-50%, 18px); opacity: 0; } }
.confetti { position: fixed; z-index: 31; pointer-events: none; width: 4px; height: 4px; border-radius: 50%; box-shadow: 0 0 8px 2px currentColor; animation: confetti 1.5s cubic-bezier(.15,.6,.4,1) forwards; }
@keyframes confetti { 0% { transform: translate(0,0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
.reveal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); background: radial-gradient(circle at 50% 40%, rgba(40,26,14,.75), rgba(5,4,3,.92)); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fadein .35s ease; }
@keyframes fadein { from { opacity: 0; } }
.reveal-card { position: relative; width: min(390px, 100%); background: linear-gradient(180deg, #241C16, #15110D); border: 1px solid var(--bronze); border-radius: 12px; padding: 30px 22px 22px; text-align: center; display: grid; gap: 10px; justify-items: center; box-shadow: var(--shadow-lg), 0 0 60px -20px rgba(217,174,85,.5); animation: pop .6s var(--spring); overflow: hidden auto; max-height: calc(100dvh - 48px); overscroll-behavior: contain; }
.reveal-card::before { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(217,174,85,.18); border-radius: 8px; pointer-events: none; }
@keyframes pop { from { transform: scale(.85) translateY(24px); opacity: 0; } }
.reveal-art { position: relative; width: 180px; height: 180px; display: grid; place-items: center; }
.reveal-art::before { content: ""; position: absolute; inset: -40px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 6%, rgba(242,213,140,.4) 8%, transparent 11% 31%, rgba(224,145,58,.35) 33%, transparent 36% 56%, rgba(242,213,140,.4) 58%, transparent 61% 81%, rgba(224,145,58,.35) 83%, transparent 86%); animation: spin 14s linear infinite; mask: radial-gradient(circle, #000 25%, transparent 68%); -webkit-mask: radial-gradient(circle, #000 25%, transparent 68%); }
.reveal-art::after { content: ""; position: absolute; inset: 24px; border-radius: 50%; background: radial-gradient(circle, rgba(242,213,140,.4), transparent 70%); animation: pulse 2.2s ease-in-out infinite; }
.reveal-art > * { position: relative; z-index: 1; }
.reveal-art .medal-ic { width: 112px; height: 112px; }
.reveal-art .medal-ic svg { width: 52px; height: 52px; }
.reveal-art .frame.mid { width: 150px; }
.reveal-art .medal { width: 124px; height: 124px; }
@keyframes spin { to { transform: rotate(1turn); } }
@keyframes pulse { 50% { transform: scale(1.12); opacity: .7; } }
.reveal .kicker { font-family: var(--font-display); font-weight: 600; letter-spacing: .2em; text-transform: uppercase; font-size: .72rem; color: var(--gold); }
.reveal h2 { font-size: var(--step-2); color: var(--gold-hi); }

/* Journey map */
.journey { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.journey > .card:last-child { position: sticky; top: 120px; }
.map-card { padding: 10px; display: grid; gap: 8px; }
.map-wrap { position: relative; border-radius: 6px; overflow: hidden; }
.map-wrap .map { touch-action: pan-y; cursor: zoom-in; user-select: none; -webkit-user-select: none; }
.map-wrap.zoomed .map { touch-action: none; cursor: grab; }
.map-wrap.zoomed .map:active { cursor: grabbing; }
.map-ctl { position: absolute; right: 10px; top: 10px; display: grid; gap: 6px; z-index: 2; }
.map-ctl button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid #8C7450; background: rgba(241,230,204,.94); color: #3A2A16; font: 700 22px/1 var(--font-display); display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 12px -4px rgba(0,0,0,.6); }
.map-ctl button svg { width: 20px; height: 20px; }
.map-ctl button[disabled] { opacity: .45; cursor: default; }
.map-hint { text-align: center; }

function normLook(l, n) {

    tunic: gated(l.tunic, "tunic"), sash: gated(l.sash, "sash"), hat: gated(l.hat, "hat"), item: gated(l.item, "item"),
    face: pick(l.face, FACES), eyes: pick(l.eyes, EYES), eyeColor: pick(l.eyeColor, EYEC), brows: pick(l.brows, BROWS), mouth: pick(l.mouth, MOUTHS),
    cover: pick(l.cover, COVERS[g]), mantle: pick(l.mantle, MANTLES[g]), jewel: g === "f" ? pick(l.jewel, JEWELS) : 0 };

    }

  };

  const brow = s => {

    return P(`M${ix} ${82 - thick * 0.75} ${topE} ${botE} Z`, bc) + S(`M${ix + s * 2} ${82} Q${px} ${py} ${tx - s * 2} ${ty - 0.6}`, hL, 0.5, 'opacity=".5"');
  };

  // nose

  let cl = 0, cr = 0, open = 0, teeth = false;

  if (mk === "parted") { open = 1.8; }
  const my = 119, full = f ? 1.6 : 0.4;
  const lx = 100 - w, ly = my + cl, rx = 100 + w, ry = my + cr;
  let mouth = "";
  mouth += `<ellipse cx="100" cy="${my + 7 + open}" rx="6" ry="2" fill="${sDD}" opacity=".3" filter="url(#sb${u})"/>`;
  if (open) mouth += P(`M${lx} ${ly} Q100 ${my + 1} ${rx} ${ry} Q100 ${my + 2 + open * 1.4} ${lx} ${ly} Z`, "#3A1614") + (teeth ? P(`M${lx + 2.5} ${ly + 0.6} Q100 ${my + 1.6} ${rx - 2.5} ${ry + 0.6} Q100 ${my + 2.4 + Math.min(open, 2.4)} ${lx + 2.5} ${ly + 0.6} Z`, "#EDE5D6") : "");
  mouth += P(`M${lx} ${ly} Q${100 - 4} ${my - 3} ${100 - 1.4} ${my - 2.2} Q100 ${my - 1.6} ${100 + 1.4} ${my - 2.2} Q${100 + 4} ${my - 3} ${rx} ${ry} Q100 ${my + 0.6} ${lx} ${ly} Z`, lipU);
  mouth += P(`M${lx + 1} ${ly + 0.4} Q100 ${my + 0.8 + open * 1.4} ${rx - 1} ${ry + 0.4} Q${100 + 3} ${my + 4.6 + full + open} 100 ${my + 5 + full + open} Q${100 - 3} ${my + 4.6 + full + open} ${lx + 1} ${ly + 0.4} Z`, lipLo);

  mouth += `<ellipse cx="${100 - 1}" cy="${my + 2.6 + full + open}" rx="3" ry="1" fill="#fff" opacity="${f ? 0.28 : 0.14}"/>`;
  if (cl < -1 || cr < -1) mouth += S(`M${lx - 1} ${ly - 0.6} q-1.4 1.6 -0.4 3.2`, sD, 0.9, 'opacity=".5"') + S(`M${rx + 1} ${ry - 0.6} q1.4 1.6 0.4 3.2`, sD, 0.9, 'opacity=".5"');

  // beard
  let beardSVG = "";
  if (!f && (beard === "trim" || beard === "full" || beard === "long")) {

    const outer = `M${100 - cw - 0.5} 96 C${100 - cw - bulge} 114 ${100 - jw - bulge} 126 ${100 - chw - 4} ${cy + drop - 4} Q100 ${cy + drop + (beard === "long" ? 8 : 3)} ${100 + chw + 4} ${cy + drop - 4} C${100 + jw + bulge} 126 ${100 + cw + bulge} 114 ${100 + cw + 0.5} 96`;
    const inner = `L${100 + cw - 4} 98 Q${100 + cw - 8} 110 ${100 + 13} 113 Q${100 + 7} 112 100 113 Q${100 - 7} 112 ${100 - 13} 113 Q${100 - cw + 8} 110 ${100 - cw + 4} 98 Z`;
    beardSVG = P(outer + inner, `url(#hr${u})`) + P(`M${100 - 12} 117 Q${100 - 7} 112 100 114 Q${100 + 7} 112 ${100 + 12} 117 Q${100 + 6} 115.4 100 116.4 Q${100 - 6} 115.4 ${100 - 12} 117 Z`, hc)
      + [...Array(9)].map((_, i) => { const x = 100 - jw + i * (jw / 4); return S(`M${x.toFixed(1)} ${(cy - 4).toFixed(1)} q${(i - 4) * 0.4} ${drop / 2 + 4} ${(i - 4) * 0.6} ${drop + 2}`, i % 2 ? hL : hD, 0.7, 'opacity=".5"'); }).join("")
      + P(`M${100 - w + 1} ${my + 1} Q100 ${my + 5} ${100 + w - 1} ${my + 1} Q100 ${my + 9} ${100 - w + 1} ${my + 1} Z`, hc, 'opacity=".6"');
  }

  // ---- hair (front) ----
  let hairFront = "";

  const hairline = `M${100 - fw - 2} 82 Q${100 - fw - 4} 50 100 ${f ? 40 : 42} Q${100 + fw + 4} 50 ${100 + fw + 2} 82`;
  if (!covered || cover === "veil" || cover === "coins" || cover === "scarf") {
    if (hair === "short" && !covered) hairFront = P(`${hairline} L${100 + fw - 1} 84 Q${100 + fw - 2} 66 ${100 + 12} 62 Q100 64 ${100 - 10} 61 Q${100 - fw + 1} 64 ${100 - fw + 1} 84 Z`, `url(#hr${u})`) + S(`M${100 - 16} 50 Q${100 - 6} 46 ${100 + 10} 50`, hL, 1, 'opacity=".5"');
    if (hair === "crop" && !covered) hairFront = P(`M${100 - fw} 74 Q${100 - fw - 1} 50 100 46 Q${100 + fw + 1} 50 ${100 + fw} 74 Q${100 + fw - 3} 62 100 60 Q${100 - fw + 3} 62 ${100 - fw} 74 Z`, hc, 'opacity=".9"');
    if (hair === "long" || hair === "bun" || hair === "braids") hairFront = P(`${hairline} L${100 + fw} 96 Q${100 + fw - 2} 66 ${100 + 2} 58 L100 60 L${100 - 2} 58 Q${100 - fw + 2} 66 ${100 - fw} 96 Z`, `url(#hr${u})`) + S("M100 46 L100 60", hD, 0.9, 'opacity=".7"') + S(`M${100 - 14} 52 Q${100 - 22} 60 ${100 - fw + 2} 78`, hL, 0.9, 'opacity=".5"');

    + P(`M${100 - fw - 8} 64 Q100 52 ${100 + fw + 8} 64 L${100 + fw + 8} 70 Q100 58 ${100 - fw - 8} 70 Z`, "#C9A04B") + P(`M96 30 Q100 8 112 12 Q104 18 104 30 Z`, "#8E2A24") + hi(`M${100 - fw - 4} 60 Q${100 - 18} 36 100 34`, 3, 0.35);

  // ---- jewelry ----
  const jk = f ? JEWELS[L.jewel][1] : "none";
  let jewelHead = "", jewelBody = "";
  if (jk === "ear" || jk === "beads") jewelHead += [-1, 1].map(s => `<circle cx="${100 + s * (cw + 2)}" cy="109" r="3.4" fill="none" stroke="url(#gd${u})" stroke-width="1.4"/>`).join("");
  if (jk === "beads") jewelBody += [...Array(13)].map((_, i) => { const t = i / 12, x = 82 + 36 * t, y = 156 + Math.sin(t * Math.PI) * 9; return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.9" fill="${i % 3 === 1 ? "#2D6E7E" : i % 3 === 2 ? "#8E2A24" : `url(#gd${u})`}"/>`; }).join("");
  if (jk === "nose") jewelHead += `<circle cx="${100 - 4.6}" cy="111" r="2.2" fill="none" stroke="url(#gd${u})" stroke-width="1"/>` + [-1, 1].map(s => `<circle cx="${100 + s * (cw + 2)}" cy="108" r="1.6" fill="url(#gd${u})"/>`).join("");

    <g class="pt-head">${ears}${face}${eyes}${brows}${nose}${beardSVG}${mouth}${hairFront}${coverFront}${hatSVG}${jewelHead}</g></g></svg>`;

/* ---- map zoom: the big map's viewBox lives in state.mapVB [x, y, w, h] ---- */
const MAP_W = 360, MAP_H = 560;
const mapVB = () => state.mapVB || [0, 0, MAP_W, MAP_H];
const mapZoom = () => MAP_W / mapVB()[2];
function setMapVB(x, y, w, opts = {}) {
  w = Math.max(MAP_W / 6, Math.min(MAP_W, w));
  const h = w * MAP_H / MAP_W;
  x = Math.max(0, Math.min(MAP_W - w, x)); y = Math.max(0, Math.min(MAP_H - h, y));
  const before = mapZoom();
  state.mapVB = w >= MAP_W - 0.5 ? null : [x, y, w, h];
  const svg = $("#bigmap");
  // Crossing the 2x line (names on/off) or 1x (controls change) needs a full redraw; otherwise just move the camera.
  if (opts.render || !svg || (before >= 2) !== (mapZoom() >= 2) || (before > 1.01) !== (mapZoom() > 1.01)) render(true);
  else svg.setAttribute("viewBox", mapVB().map(v => v.toFixed(1)).join(" "));
}
function zoomMapAt(factor, cx, cy) {
  const [x, y, w, h] = mapVB(), nw = w / factor;
  setMapVB(cx - (cx - x) * (nw / w), cy - (cy - y) * (nw / w), nw);
}
function mapPoint(svg, clientX, clientY) {
  const r = svg.getBoundingClientRect(), [x, y, w, h] = mapVB();
  // preserveAspectRatio "slice": the same scale on both axes, centered
  const s = Math.max(r.width / w, r.height / h);
  return { x: x + (clientX - r.left - (r.width - w * s) / 2) / s, y: y + (clientY - r.top - (r.height - h * s) / 2) / s, s };
}
function mapControl(kind) {
  const [x, y, w, h] = mapVB();
  if (kind === "in") zoomMapAt(1.6, x + w / 2, y + h / 2);
  if (kind === "out") zoomMapAt(1 / 1.6, x + w / 2, y + h / 2);
  if (kind === "reset") setMapVB(0, 0, MAP_W);
  if (kind === "me") { const p = journeyPos(state.me ? stats(state.me).n : 0), nw = MAP_W / 3; setMapVB(p.x - nw / 2, p.y - nw * MAP_H / MAP_W / 2 - 10, nw); }
}
let mapDragged = false;
function setupMapGestures() {
  const svg = $("#bigmap"); if (!svg || svg.dataset.wired) return;
  svg.dataset.wired = "1";
  const pts = new Map(); let last = null, pinch = null, moved = 0;
  svg.addEventListener("pointerdown", e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0; mapDragged = false;
    if (pts.size === 1) last = { x: e.clientX, y: e.clientY };
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; }
  });
  svg.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && pinch) {
      const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d > 0 && pinch.d > 0) { const m = mapPoint($("#bigmap"), (a.x + b.x) / 2, (a.y + b.y) / 2); zoomMapAt(d / pinch.d, m.x, m.y); pinch.d = d; mapDragged = true; }
      return;
    }
    if (pts.size === 1 && last && mapZoom() > 1.01) {
      const dx = e.clientX - last.x, dy = e.clientY - last.y; moved += Math.abs(dx) + Math.abs(dy);
      const s = mapPoint($("#bigmap"), e.clientX, e.clientY).s, [x, y, w] = mapVB();
      if (moved > 4) { setMapVB(x - dx / s, y - dy / s, w); mapDragged = true; }
      last = { x: e.clientX, y: e.clientY };
    }
  });
  const end = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) last = null; };
  ["pointerup", "pointercancel", "pointerleave"].forEach(t => svg.addEventListener(t, end));
  svg.addEventListener("wheel", e => { e.preventDefault(); const m = mapPoint(svg, e.clientX, e.clientY); zoomMapAt(e.deltaY < 0 ? 1.25 : 0.8, m.x, m.y); }, { passive: false });
  svg.addEventListener("dblclick", e => { const m = mapPoint(svg, e.clientX, e.clientY); zoomMapAt(2, m.x, m.y); });
}

/* ---------- In-app KJV reader: one small JSON file per book in kjv/, loaded when needed ---------- */
const KJV = {}, KJV_LOADING = {};
const bookFile = b => "kjv/" + b.replace(/ /g, "") + ".json";
function loadBooks(list) {
  list.forEach(b => {
    if (b in KJV || KJV_LOADING[b]) return;
    KJV_LOADING[b] = fetch(bookFile(b)).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(j => { KJV[b] = j; }).catch(() => { KJV[b] = null; })
      .finally(() => { delete KJV_LOADING[b]; if (state.tab === "read" || state.tab === "quiz") render(true); });
  });
}
const RD_SIZES = [0.95, 1.05, 1.15, 1.28, 1.42, 1.6];
function openReader(day, from) {
  state.readDay = day; state.readFrom = from || state.tab;
  if (state.tab === "read") { render(true); window.scrollTo({ top: 0 }); } else setTab("read");
}
function viewRead() {
  const d = Math.max(1, Math.min(DAYS, state.readDay || 1)), p = PLAN[d - 1], s = stats(state.me), isDone = s.doneSet.has(d);
  const start = parseISO(state.config.start), chs = CHAPTERS.slice(p.from, p.to);
  const books = [...new Set(chs.map(c => c.b))];
  loadBooks(books.filter(b => !(b in KJV)));
  const failed = books.some(b => KJV[b] === null), ready = books.every(b => KJV[b]);
  const size = RD_SIZES[state.rdSize ?? 2] || 1.15, light = !!state.rdLight;
  const backTo = state.readFrom === "plan" ? ["plan", "Back to the plan"] : ["today", "Back to Today"];
  let text;
  if (failed) text = `<div class="note warn">Couldn't load the Bible text. Check your connection, or <a href="${readingURL(p.label, "KJV")}" target="_blank" rel="noopener">open it on Bible Gateway</a>.</div>`;
  else if (!ready) text = `<div class="rd-loading"><span></span><span></span><span></span><p class="small muted">Opening the scroll…</p></div>`;
  else text = chs.map((c, i) => {

    return `<section class="rd-chapter" id="rd-ch-${i}"><h3>${esc(c.one ? c.b : `${c.b} ${c.c}`)}</h3>
      <p>${verses.map((t, v) => `<sup>${v + 1}</sup>${esc(t)}`).join(" ")}</p></section>`;
  }).join("");
  const next = d < DAYS ? PLAN[d] : null;
  const finish = isDone
    ? `<div class="rd-done"><p class="eyebrow">${icon("check")} Day ${d} read</p>

        <button class="linkish" data-toggle="${d}">Mark Day ${d} as not read</button></div>`
    : `<div class="rd-done"><p class="muted">Finished all ${plural(p.count, "chapter")}?</p>
        <button class="btn go big" data-toggle="${d}" ${state.readOnly ? "disabled" : ""}>${icon("check")} I read Day ${d}</button></div>`;
  return `<button class="linkish back" data-tab="${backTo[0]}">← ${backTo[1]}</button>
  <article class="card reader${light ? " light" : ""}" style="--rd-size:${size}rem">
    <header class="rd-head">
      <p class="eyebrow">Day ${d}${start ? " · " + fmtDate(dayDate(start, d)) : ""} · King James Version</p>
      <h2>${esc(p.label)}</h2>

        ${chs.length > 1 ? `<div class="rd-jump" aria-label="Jump to chapter">${chs.map((c, i) => `<button data-jump="${i}">${esc(c.one ? c.b : (i === 0 || chs[i - 1].b !== c.b ? `${c.ab} ${c.c}` : String(c.c)))}</button>`).join("")}</div>` : "<span></span>"}
        <div class="rd-opts"><button data-rdsize="-1" aria-label="Smaller text">A−</button><button data-rdsize="1" aria-label="Larger text">A+</button>
          <button data-rdlight="1" aria-label="${light ? "Dark page" : "Light page"}">${light ? "Dark" : "Light"}</button></div>
      </div>
    </header>
    <div class="rd-text">${text}</div>
    ${ready ? finish : ""}

  if (behind.length) {
    const first = behind[0], today = new Date(), lateBy = target + behind.length > DAYS;
    const plan = lateBy ? "Read a little extra each day and you can still finish by the last day."
      : `Read one extra day each day and you'll be caught up by ${fmtDate(new Date(today.getFullYear(), today.getMonth(), today.getDate() + behind.length))}.`;
    catchup = `<section class="card stack catchup">
      <h3>Catching up</h3>
      <p class="muted">You're ${plural(behind.length, "day")} behind. No worries, it happens. ${plan}</p>
      <div class="row"><button class="btn go" data-readday="${first.day}">${icon("book")} Read Day ${first.day}</button><button class="btn sm" data-toggle="${first.day}" ${state.readOnly ? "disabled" : ""}>${icon("check")} Mark read</button><span class="small muted">${esc(first.label)}</span></div>
      ${thruControl(s, target)}
      ${behind.length > 1 ? `<details class="pick"><summary class="small">Pick a specific day</summary><div class="catch">${behind.map(d => `<button class="btn sm" data-toggle="${d.day}" ${state.readOnly ? "disabled" : ""}>Day ${d.day} · ${esc(d.short)}</button>`).join("")}</div></details>` : ""}
    </section>`;
  }

  const nv = VICTORIES.find(v => v.day > s.n);
  const pct = Math.round(s.chapters / TOTAL * 100);
  const stat = (k, val, unit, label, color, ic) => `<div class="stat"><span class="ic" style="color:${color}">${icon(ic)}</span><b><span data-count="${val}" data-k="${k}">${val}</span>${unit ? `<small>${unit}</small>` : ""}</b><span class="sl">${label}</span></div>`;
  return `${banner}${recapCard()}
  ${state.readOnly ? `<div class="note warn">You can look around, but your progress can't be saved yet. Ask your leader for access.</div>` : ""}
  <section class="card">${hero}</section>
  <section class="prog" aria-label="Your progress">
    <div class="prog-line"><span><b>${s.n}</b> of 70 days</span><span>${icon("flame")} <b>${s.streak}-day</b> streak</span><span><b>${pct}%</b> of the New Testament</span></div>
    <div class="meter" role="img" aria-label="${s.chapters} of 260 chapters"><i data-w="${s.chapters / TOTAL * 100}" data-k="m-main" style="width:${s.chapters / TOTAL * 100}%"></i></div>
  </section>
  ${quizNudge()}
  ${cheersReceivedCard()}
  ${catchup}
  ${tripCard(s.n)}
  <details class="card more" id="more" ${state.openProgress ? "open" : ""}>
    <summary><span><h3>My progress</h3><span class="small muted">Stats, badges${nv ? " and your next Victory Moment" : ""}</span></span>${icon("plan")}</summary>
    <div class="stack" style="gap:16px;margin-top:14px">
      <div class="stats">
        ${stat("days", s.n, "/70", "days done", "var(--teal)", "plan")}
        ${stat("ch", s.chapters, "", "of 260 chapters", "var(--sky)", "book")}
        ${stat("streak", s.streak, "", `day streak · best ${s.best}`, "var(--flame)", "flame")}
        ${stat("pct", pct, "%", "of the New Testament", "var(--violet)", "target")}
      </div>
      ${nv ? `<div class="row" style="gap:14px;flex-wrap:nowrap;min-width:0">${victoryMedal(VICTORIES.indexOf(nv)).replace('class="medal"', 'class="medal" style="width:46px;height:46px;flex:none;filter:grayscale(.6);opacity:.8"')}
        <div style="min-width:0"><p class="eyebrow">Next Victory Moment · Day ${nv.day}</p><b>${esc(nv.title)}</b><p class="small muted">${plural(nv.day - s.n, "more day")} to unlock this story from ${esc(nv.ref)}.</p></div></div>` : ""}
      <div><div class="row between" style="margin-bottom:8px"><b>Badges</b><span class="small muted">${BADGES.filter(b => b.test(s)).length} of ${BADGES.length}</span></div>
        <div class="badges">${BADGES.map(b => { const on = b.test(s); return `<div class="badge ${on ? "" : "locked"}">${medalIcon(b)}<div><b>${b.name}</b><span>${b.desc}</span></div></div>`; }).join("")}</div></div>
      ${behind.length ? "" : thruControl(s, target)}
    </div>
  </details>`;
}

// "I've read through Day X" for people who read ahead or in a paper Bible.
function thruControl(s, target) {
  const first = nextUndone(s); if (!first || state.readOnly) return "";
  const def = Math.max(first, target || first);
  const opts = PLAN.filter(d => d.day >= first).map(d => `<option value="${d.day}" ${d.day === def ? "selected" : ""}>Day ${d.day} · ${esc(d.short)}</option>`).join("");
  return `<div class="thru"><label for="thru-day" class="small">Reading in a paper Bible? Mark everything read through</label>
    <div class="row" style="flex-wrap:nowrap"><select id="thru-day" style="flex:1;min-width:0">${opts}</select><button class="btn sm" data-thru="1">Mark read</button></div></div>`;
}

function tripCard(n) {
  const pos = journeyPos(n), next = STOPS.find(t => t.day > n);
  const where = !next ? "You made it to Jerusalem for the Passover!" : pos.t === 0 ? `You're in ${STOPS[pos.k].place}` : `On the road from ${STOPS[pos.k].place} to ${STOPS[pos.k + 1].place}`;
  return `<section class="card trip"><button class="trip-map" data-tab="journey" aria-label="Open the journey map">${mapSVG({ mini: true })}</button>
    <div class="stack" style="gap:6px"><p class="eyebrow">Journey to the Passover</p><h3>${esc(where)}</h3>
    <p class="small muted">${next ? `${plural(next.day - n, "day")} to ${esc(next.place)} · ${plural(DAYS - n, "day")} to the Passover in Jerusalem` : "You walked the whole road with Jesus, from Bethlehem to Jerusalem."}</p>
    <div><button class="btn sm" data-tab="journey">${icon("journey")} Open map</button></div></div></section>`;
}

function viewPlan() {
  const s = stats(state.me), pd = planDay(), start = parseISO(state.config.start);
  const sel = state.sel ? PLAN[state.sel - 1] : null;
  let detail = "";
  if (sel) {
    const isDone = s.doneSet.has(sel.day);
    const date = start ? fmtDate(dayDate(start, sel.day)) : "";
    detail = `<section class="card stack" id="daydetail"><div class="row between"><div class="stack" style="gap:4px">
        <p class="eyebrow">Day ${sel.day}${date ? " · " + date : ""}${isDone ? " · read " + fmtDate(parseISO(state.me.done[sel.day])) : ""}</p>
        <h2>${esc(sel.label)}</h2></div><span class="chip sec sec-${sel.sec}">${SECTIONS[sel.sec]}</span></div>
      <div class="row">
      <button class="btn ${isDone ? "done-state" : "go"}" data-toggle="${sel.day}" ${state.readOnly ? "disabled" : ""}>${isDone ? `${icon("check")} Read · tap to undo` : `${icon("check")} I read this`}</button>
      <button class="btn" data-readday="${sel.day}">${icon("book")} Read here</button>
      ${isDone ? `<button class="btn" data-quiz="${sel.day}">${icon("target")} ${(state.me.quiz || {})[sel.day] !== undefined ? `Quiz ${state.me.quiz[sel.day]}/5` : "Quiz"}</button>` : ""}
      <button class="btn sm" data-sel="">Close</button></div></section>`;
  }
  let weeks = "";
  for (let w = 0; w < 10; w++) {
    const v = VICTORIES[w];
    weeks += `<div class="week"><div class="week-head"><h3>Week ${w + 1}</h3><span class="small muted">Victory: ${esc(v.title)}</span></div><div class="days">`;
    for (let i = 1; i <= 7; i++) {
      const p = PLAN[w * 7 + i - 1], done = s.doneSet.has(p.day);
      weeks += `<button class="tile sec-${p.sec} ${done ? "done" : ""} ${pd === p.day ? "today" : ""} ${state.sel === p.day ? "sel" : ""} ${p.day % 7 === 0 ? "vic" : ""}"
        data-sel="${p.day}" aria-label="Day ${p.day}: ${esc(p.label)}${done ? ", read" : ""}">${done ? `<span class="ck">${icon("check")}</span>` : ""}<span class="n">${p.day}</span><span class="r">${esc(p.short)}</span></button>`;
    }
    weeks += `</div></div>`;
  }
  return `${detail}<section class="card stack">
    <div class="row between"><h2>The 70-day map</h2><span class="small muted">${s.n}/70 days · about 4 chapters a day</span></div>
    <div class="legend">${Object.entries(SECTIONS).map(([k, l]) => `<span class="chip sec sec-${k}">${l}</span>`).join("")}</div>
    <p class="small muted">Tap any day to open its reading or check it off. The gold ring is today; a gold dot marks a Victory Moment.</p>
    <div>${weeks}</div></section>`;
}

// Members of the tribe tapped on the Group tab, most days read first
function tribeRoster(list) {
  const i = state.tribeOpen;
  if (i === null || i === undefined) return "";
  const mem = list.filter(p => teamIndex(p) === i);
  const rows = mem.map(p => {
    const isMe = state.me && p.id === state.me.id;
    return `<li class="${isMe ? "me" : ""}"><span class="bubble">${avatarSVG(p.look, p.s.n, { bust: true })}</span>
      <div class="who"><b>${esc(p.alias)}${isMe ? " (you)" : ""}</b><span>${p.s.streak > 0 ? `${p.s.streak}-day streak` : "no streak"}${p.s.perfect ? ` · ${p.s.perfect} perfect ${p.s.perfect === 1 ? "quiz" : "quizzes"}` : ""}</span></div>
      <div class="nums"><b>${p.s.n}/70</b>${p.s.chapters} chapters</div></li>`;
  }).join("");
  return `<div class="roster" id="roster" style="--tc:${TEAM_COLORS[i]}"><div class="row between"><h3>${crest(i)}<span>${esc(state.config.teams[i])}</span></h3>
    <span class="row" style="gap:10px"><span class="small muted">${plural(mem.length, "member")}</span><button class="btn sm" data-tribe="">Close</button></span></div>
    ${rows ? `<ul>${rows}</ul>` : `<p class="small muted">No one is in this tribe yet.</p>`}</div>`;
}

function viewGroup() {
  const list = allPlayers().sort((a, b) => b.s.n - a.s.n || b.s.streak - a.s.streak || a.alias.localeCompare(b.alias));
  const teams = state.config.teams;
  const teamHTML = `<section class="card stack"><h2>The four tribes</h2><p class="small muted">Everyone is placed into a tribe when they join. Tribes are ranked by average chapters read plus a bonus point for every perfect quiz, so a smaller tribe can still win. Tap a tribe to see who's in it.</p><div class="teams">${
    teams.map((t, i) => {
      const mem = list.filter(p => teamIndex(p) === i), ch = mem.reduce((a, p) => a + p.s.chapters, 0);
      const qp = mem.reduce((a, p) => a + p.s.perfect, 0);  // each perfect quiz adds one point
      return { t, i, mem, ch, qp, avg: mem.length ? ch / mem.length / TOTAL * 100 : 0, pts: mem.length ? (ch + qp) / mem.length : 0 };
    }).sort((a, b) => b.pts - a.pts).map((x, rank) => `<button class="team ${state.tribeOpen === x.i ? "open" : ""}" style="--tc:${TEAM_COLORS[x.i]}" data-tribe="${x.i}" aria-expanded="${state.tribeOpen === x.i}" aria-controls="roster">
      <h3>${crest(x.i)}<span>${esc(x.t)}</span>${rank === 0 && x.avg > 0 ? ' <span class="rank1">Leading</span>' : ""}</h3>
      <div class="meter"><i data-w="${x.avg}" data-k="m-team${x.i}" style="width:${x.avg}%"></i></div>
      <p class="small"><b>${Math.round(x.avg)}%</b> average · ${x.ch} chapters${x.qp ? ` · ${plural(x.qp, "quiz point")}` : ""} · ${plural(x.mem.length, "member")}</p>
      <p class="small muted"><i>"${TEAM_VERSES[x.i][0]}"</i> ${TEAM_VERSES[x.i][1]}</p>
      <span class="tsee">${state.tribeOpen === x.i ? "Hide members" : "See members"} <i aria-hidden="true">›</i></span></button>`).join("")}</div>${tribeRoster(list)}</section>`;
  const cols = Array.from({ length: DAYS + 1 }, () => []);
  list.forEach(p => cols[p.s.n].push(p));
  const myN = state.me ? stats(state.me).n : -1;
  const track = `<div class="track-wrap" id="track"><div class="track">${cols.map((ps, i) => `<div class="tcol"><div class="ppl">${ps.slice(0, 4).map(p => `<span title="${esc(p.alias)}">${avatarSVG(p.look, p.s.n, { live: state.me && p.id === state.me.id })}</span>`).join("")}${ps.length > 4 ? `<span class="more">+${ps.length - 4}</span>` : ""}</div>
      <span class="tdot ${i === 0 ? "go" : ""} ${i && i % 7 === 0 ? "mile" : ""} ${i === myN ? "me" : ""}" ${i === myN ? 'id="trackme"' : ""}></span><span class="tlabel">${i === 0 ? "Start" : (i % 7 === 0 ? i : "")}</span></div>`).join("")}</div></div>`;
  const pd = planDay();
  const rows = list.map((p, idx) => {
    const isMe = state.me && p.id === state.me.id;
    const ti = teamIndex(p);
    const canMove = state.mode === "shared" && (state.backend === "firebase" ? state.canLead : state.isOwner);
    const mv = canMove ? `<select class="tmove" data-move="${esc(p.id)}" aria-label="Move ${esc(p.alias)} to another tribe">${teams.map((t, i) => `<option value="${i}" ${i === ti ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>` : "";
    const pace = pd && pd >= 1 ? (p.s.n >= Math.min(pd, DAYS) ? "on pace" : `${Math.min(pd, DAYS) - p.s.n} behind`) : "";
    const rm = state.isOwner && !isMe ? (state.confirmRemove === p.id
      ? `<button class="btn sm danger" data-remove="${esc(p.id)}">Confirm remove</button>`
      : `<button class="btn sm" data-askremove="${esc(p.id)}" aria-label="Remove ${esc(p.alias)}">Remove</button>`) : "";
    const canRecover = state.backend === "firebase" && state.canLead && !isMe;
    const rec = !canRecover ? "" : state.recoverFor === p.id
      ? `<div class="recover"><label class="small" for="rec-name">New username for ${esc(p.alias)}</label>
          <div class="row" style="flex-wrap:nowrap"><input type="text" id="rec-name" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="e.g. jordan.smith2" style="flex:1;min-width:0">
          <button class="btn sm go" data-recover-go="${esc(p.id)}">Move</button><button class="btn sm" data-recover="">Cancel</button></div>
          <span class="small muted">Their progress moves the next time they sign in with that username.</span></div>`
      : `<button class="btn sm" data-recover="${esc(p.id)}" aria-label="Recover ${esc(p.alias)} to a new account">Recover</button>`;
    return `<div class="prow ${isMe ? "me" : ""}${state.recoverFor === p.id ? " recovering" : ""}"><span class="rank">${idx + 1}</span><span class="bubble">${avatarSVG(p.look, p.s.n, { bust: true })}</span>
      <div class="who"><b>${esc(p.alias)}${isMe ? " (you)" : ""}</b><span>${ti >= 0 ? `<span class="dot" style="background:${TEAM_COLORS[ti]}"></span>${esc(teams[ti])} · ` : ""}${p.s.streak > 0 ? `${p.s.streak}-day streak` : "no streak"}${pace ? " · " + pace : ""}</span></div>
      <div class="nums"><b>${p.s.n}/70</b>${p.s.chapters} chapters</div>
      ${(() => { const acts = cheerButtons(p) + mv + (state.recoverFor === p.id ? "" : rec) + rm; return acts ? `<div class="prow-acts">${acts}</div>` : ""; })()}${state.recoverFor === p.id ? rec : ""}</div>`;
  }).join("");
  return `${state.mode === "local" ? `<div class="note">You're playing solo on this device, so only your own character shows here. Open the group's shared link and sign in to join everyone else.</div>` : ""}
  ${teamHTML}
  <section class="card stack"><h2>The road to Revelation</h2><p class="small muted">Each dot is one day of reading; gold dots are Victory Moments. Scroll sideways to see everyone.</p>${track}</section>
  <section class="card stack"><div class="row between"><h2>Leaderboard</h2><span class="small muted">${plural(list.length, "reader")}</span></div><div class="board">${rows || '<p class="muted">Nobody has joined yet.</p>'}</div></section>`;
}

function viewVictories() {
  const n = stats(state.me).n;
  return `<section class="card stack"><h2>Victory Moments</h2>
    <p class="muted" style="max-width:68ch">Every 7 days of reading unlocks a story where God's people faced a battle or a hard situation and God brought them through. Use them for group discussion each week.${state.canLead && state.mode === "shared" ? " As a leader you can read all of them ahead of time." : ""}</p></section>
  <div class="vics">${VICTORIES.map((v, i) => {
    const open = n >= v.day || (state.canLead && state.mode === "shared");
    if (!open) return `<article class="card vic locked">${victoryMedal(i)}<div class="body"><p class="eyebrow">Week ${i + 1} · unlocks after ${v.day} days read</p><h3>${esc(v.title)}</h3><p class="small muted">${plural(v.day - n, "more day")} to go. Keep reading to unlock this story from ${esc(v.ref)}.</p></div></article>`;
    return `<article class="card vic">${victoryMedal(i)}<div class="body"><p class="eyebrow">Week ${i + 1} · ${esc(v.ref)}</p><h3>${esc(v.title)}</h3>
      <p>${esc(v.story)}</p><blockquote>"${esc(v.verse)}"<span>${esc(v.verseRef)} · KJV</span></blockquote>
      <p class="small"><b>New Testament connection (KJV):</b> ${esc(v.nt)}</p>
      <div class="q"><b>Talk about it:</b> ${esc(v.q)}</div>
      <div class="row"><a class="btn sm" href="${readingURL(v.ref, state.config.version)}" target="_blank" rel="noopener">Read ${esc(v.ref)} ${icon("ext")}</a></div>
      ${discussionHTML(i + 1)}</div></article>`;
  }).join("")}</div>`;
}

function viewEditor(onboarding) {
  const d = state.draft, n = onboarding ? 0 : stats(state.me).n, g = d.gender;
  d.look.g = g;
  const taken = takenAliases();
  const names = g === "f" ? NAMES_F : NAMES_M;
  const nm0 = draftName(d), alias = (nm0 + (nm0 && d.place ? " " + d.place : "")).trim();
  const aliasTaken = !!nm0 && taken.has(alias.toLowerCase());
  const swatches = (key, arr, label) => arr.map((c, i) => `<button class="sw-opt" style="background:${Array.isArray(c) ? c[1] : c}" data-look="${key}" data-val="${i}" aria-pressed="${d.look[key] === i}" aria-label="${Array.isArray(c) ? esc(c[0]) : `${label} ${i + 1}`}" title="${Array.isArray(c) ? esc(c[0]) : ""}"></button>`).join("");
  const unl = key => allowedFor(key, g).map(([[label, val, need], i]) => {
    const locked = need > n;
    if (key === "tunic" || key === "sash") return `<button class="sw-opt ${locked ? "lock" : ""}" style="background:${val}" data-look="${key}" data-val="${i}" aria-pressed="${d.look[key] === i}" ${locked ? `data-day="${need}d" aria-disabled="true"` : ""} title="${esc(label)}${locked ? ` (unlocks after ${need} days)` : ""}" aria-label="${esc(label)}${locked ? `, locked until ${need} days` : ""}"></button>`;
    return `<button class="opt ${locked ? "lock" : ""}" data-look="${key}" data-val="${i}" aria-pressed="${d.look[key] === i}" ${locked ? 'aria-disabled="true"' : ""}>${locked ? `<span class="lk">${icon("lock")}</span>` : ""}${esc(label)}${locked ? ` · ${need}d` : ""}</button>`;
  }).join("");
  const teams = state.config.teams, myTeam = state.me ? teamIndex(state.me) : -1;
  const L = normLook(d.look, n);
  return `${onboarding ? `<section class="card stack"><p class="eyebrow">${esc(state.config.groupName)}</p><h2>Create your character</h2>
      <p class="muted" style="max-width:68ch">Together we're reading the whole New Testament, Matthew to Revelation, in 70 days: about 4 chapters a day. Choose a Bible name or use your own first name, dress your character the way people dressed in the first century, and you'll be placed into one of four tribes. Reading unlocks new gear.</p></section>` : ""}
  <section class="card editor">
    <div class="preview"><div class="frame big">${avatarSVG(d.look, n, { portrait: true, live: true })}<div class="frame-fig">${avatarSVG(d.look, n, { live: true })}</div></div>
      <div class="alias" id="alias-preview">${esc(alias || "Choose a name")}</div>
      <p class="small muted" style="text-align:center">${g === "f" ? "Sister" : "Brother"}${L.cover ? " · " + COVERS[g][L.cover][0] : ""} · ${MANTLES[g][L.mantle][0]} ${g === "f" ? "shawl" : "mantle"}</p>
      <p class="small" id="alias-taken" style="color:var(--rose)" ${aliasTaken ? "" : "hidden"}>Someone already has that name. Add a hometown or pick another.</p>
      <button class="btn go save-btn" data-save="1" ${!nm0 || aliasTaken || state.readOnly ? "disabled" : ""}>${onboarding ? "Begin the quest" : "Save changes"}</button>
      ${!onboarding ? `<p class="small muted" style="text-align:center">${state.readOnly ? "Saving is turned off for you." : "Saves to the group leaderboard."}</p>` : ""}
    </div>
    <div class="stack" style="gap:26px">
      <div class="group"><h3 class="ghead">Identity</h3>
      <div class="field"><span class="lbl">I'm a</span>
        <div class="seg" role="group" aria-label="Brother or sister"><button data-gender="m" aria-pressed="${g === "m"}">Brother</button><button data-gender="f" aria-pressed="${g === "f"}">Sister</button></div></div>
      <div class="field"><span class="lbl">Name</span>
        <div class="seg" role="group" aria-label="Name type"><button data-namemode="bible" aria-pressed="${d.nameMode !== "own"}">Bible name</button><button data-namemode="own" aria-pressed="${d.nameMode === "own"}">My own name</button></div>
        ${d.nameMode === "own"
          ? `<input type="text" id="own-name" maxlength="20" autocomplete="given-name" placeholder="First name or nickname" value="${esc(d.ownName || "")}" aria-label="Your first name or nickname">
             <p class="small muted">First name or nickname only, up to 20 letters. It's shown to everyone in the group.</p>`
          : `<div class="opts">${names.map(nm => { const t = taken.has((nm + (d.place ? " " + d.place : "")).toLowerCase());
              return `<button class="opt" data-name="${esc(nm)}" aria-pressed="${d.name === nm}" ${t ? "disabled" : ""}>${esc(nm)}</button>`; }).join("")}</div>`}
        <div class="row"><label for="place" class="small">Hometown (optional)</label>
          <select id="place">${PLACES.map(p => `<option value="${esc(p)}" ${d.place === p ? "selected" : ""}>${p ? esc(p) : "None"}</option>`).join("")}</select>
          ${d.nameMode === "own" ? "" : `<button class="btn sm" data-random="1">Random name</button>`}</div>
      </div>
      <div class="field"><span class="lbl">Tribe</span>
        ${myTeam >= 0 ? `<div class="tribe-line">${crest(myTeam)}<div><b>${esc(teams[myTeam])}</b><span class="small muted">Assigned when you joined. Ask a leader if you need to move.</span></div></div>`
          : `<p class="small muted">You'll be placed into one of the four tribes (${teams.map(esc).join(", ")}) when you join, keeping the teams even.</p>`}
      </div>
      </div>
      <div class="group"><h3 class="ghead">Face</h3>
      <div class="two">
        <div class="field"><span class="lbl">Skin</span><div class="opts">${swatches("skin", SKINS, "Skin tone")}</div></div>
        <div class="field"><span class="lbl">Eye color</span><div class="opts">${swatches("eyeColor", EYEC, "Eye color")}</div></div>
      </div>
